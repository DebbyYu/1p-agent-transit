<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1P Agent 頝舐雯??繚 Microsoft 365 Copilot</title>
<style>
  :root{
    --bg:#f2f4f7; --panel:#fff; --ink:#15181d; --ink2:#616b78; --line:#dfe3e9;
    --ga:#137a45; --pv:#a06a00; --fr:#5a4fbf;
    --spk:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9.5a4 4 0 0 1 0 5"/><path d="M18.5 7a7.5 7.5 0 0 1 0 10"/></svg>');
    --sans:"Microsoft JhengHei UI","Microsoft JhengHei","Segoe UI","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased}
  body.locked{overflow:hidden}
  button{font-family:inherit}

  #cover{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    flex-direction:column; padding:24px; background:var(--bg); overflow:hidden;
    transition:opacity .35s ease}
  #cover.gone{opacity:0; pointer-events:none; visibility:hidden}
  #cover.leaving{pointer-events:none}
  .stage{position:relative; width:min(940px,100%)}
  .rails{position:absolute; left:-70vw; right:-70vw; top:91.4%; pointer-events:none}
  .rails i{display:block; height:7px; border-radius:4px; background:#c3cad3}
  .rails i+i{margin-top:9px; background:#d8dee5}
  .train{width:100%; cursor:pointer; position:relative;
    transition:transform .3s cubic-bezier(.2,.8,.3,1)}
  .train:hover{transform:translateX(8px)}
  .train svg{display:block; width:100%; height:auto; overflow:visible}

  .train .hs-body{fill:#fff}
  .train .hs-shade{fill:#e8edf3}
  .train .hs-win{fill:#dfe6ee}
  .train .hs-glass{fill:#39424f}
  .train .hs-skirt{fill:#cfd7e0}
  .cvtext{position:absolute; left:5.5%; top:43.2%; transform:translateY(-50%);
    width:50%; color:var(--ink)}
  .dest{display:inline-flex; align-items:center; gap:8px; background:#1b1f26; color:#eef3f8;
    font-size:11px; letter-spacing:.18em; padding:5px 11px; border-radius:4px; font-weight:700}
  .dest i{width:6px;height:6px;border-radius:50%;background:#ffd77a; box-shadow:0 0 7px #ffd77a}
  .cvt{font-size:clamp(21px,2.5vw,30px); font-weight:700; margin:12px 0 8px; letter-spacing:-.015em}
  .cvs{font-size:14px; color:#2f3742; line-height:1.8; margin:0}
  .cvcta{margin-top:26px; font-size:13px; color:var(--ink2); letter-spacing:.06em; text-align:center}
  /* departure */
  #cover.leaving .train{transition:transform 1.05s cubic-bezier(.5,.02,.62,.4); transform:translateX(155vw)}
  #cover.leaving .cvcta{opacity:0; transition:opacity .3s}
  #cover.leaving .speed{opacity:1}
  .speed{position:absolute; left:0; right:0; top:34%; height:32%; opacity:0; pointer-events:none;
    transition:opacity .2s .15s}
  .speed i{position:absolute; height:3px; border-radius:2px; background:linear-gradient(90deg,transparent,#aab6c4);
    animation:whoosh .5s linear infinite}
  .speed i:nth-child(1){top:12%; left:-30%; width:38%; animation-delay:.02s}
  .speed i:nth-child(2){top:42%; left:-46%; width:52%; animation-delay:.12s}
  .speed i:nth-child(3){top:72%; left:-24%; width:30%; animation-delay:.2s}
  @keyframes whoosh{from{transform:translateX(0)}to{transform:translateX(180%)}}
  .lang-float{position:fixed; top:18px; right:20px; z-index:70}
  #cover.gone .lang-float{display:none}
  .seg{display:flex; gap:2px; background:#e6eaef; border-radius:7px; padding:3px}
  .seg button{border:0;background:transparent;color:var(--ink2);padding:6px 13px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:600}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(21,24,29,.14)}

  #app{opacity:0; transition:opacity .5s ease .25s} #app.in{opacity:1}
  header{position:sticky; top:0; z-index:30; background:rgba(242,244,247,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:13px 22px}
  .hin{max-width:1320px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700}
  .brand img{height:21px}
  .sep{width:1px; height:18px; background:var(--line)}
  .sw{flex:1; min-width:190px; position:relative}
  #q{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:7px; background:#fff;
    font-size:13.5px; outline:none; color:var(--ink)}
  #q:focus{border-color:var(--ink); box-shadow:0 0 0 3px rgba(21,24,29,.07)}
  .sw svg{position:absolute; left:11px; top:50%; transform:translateY(-50%)}
  .back{border:1px solid var(--line); background:#fff; color:var(--ink2); padding:8px 14px; border-radius:7px;
    cursor:pointer; font-size:13px; font-weight:600}
  .back:hover{background:#eef1f5}
  .announcement-fab{position:fixed; left:20px; bottom:20px; z-index:32; width:56px; height:56px;
    border:1px solid #c3ddd9; border-radius:50%; background:#fff; cursor:pointer; padding:7px;
    box-shadow:0 8px 24px rgba(20,40,60,.18); transition:transform .16s, box-shadow .16s}
  .announcement-fab:hover{transform:translateY(-2px); box-shadow:0 11px 28px rgba(20,40,60,.22)}
  .announcement-fab:focus-visible{outline:3px solid rgba(15,118,110,.3); outline-offset:3px}
  .announcement-fab svg{display:block; width:100%; height:100%}

  main{max-width:1320px; margin:0 auto; padding:28px 22px 70px}
  h1{font-size:clamp(21px,2.8vw,29px); margin:0 0 9px; font-weight:700; letter-spacing:-.015em}
  .lede{margin:0 0 22px; color:var(--ink2); font-size:14.4px; line-height:1.85; max-width:82ch}
  .key{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
  .kb{border:1px solid var(--line); background:#fff; border-radius:20px; padding:7px 15px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink2); display:inline-flex; gap:8px; align-items:center}
  .kb i{width:14px; height:5px; border-radius:3px; background:var(--ink2)}
  .kb.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .kb.on i{background:#fff !important}
  .cnt{margin-left:auto; font-size:12.5px; color:var(--ink2)}

  .mapwrap{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px;
    box-shadow:0 4px 16px rgba(21,24,29,.05); overflow:hidden}
  svg.map{display:block; width:100%; height:auto}
  /* the phone version of the network: rails run downwards */
  .vmap{display:none}
  .vl{--c:#616b78; margin-top:18px}
  .vl:first-child{margin-top:2px}
  .vl h3{display:flex; align-items:center; gap:9px; margin:0 0 6px; font-size:14px}
  .vl h3 .vk{width:22px; height:7px; border-radius:4px; background:var(--c); flex:none}
  .vl h3 b{color:var(--c)}
  .vl h3 .vc{margin-left:auto; font-size:11.5px; color:var(--ink2);
    font-variant-numeric:tabular-nums}
  .vl ul{list-style:none; margin:0; padding:0; position:relative}
  .vl ul::before{content:''; position:absolute; left:13.5px; top:20px; bottom:20px;
    width:5px; border-radius:3px; background:var(--c); opacity:.92}
  .vst{display:flex; align-items:center; gap:11px; padding:5px 4px; cursor:pointer;
    border-radius:10px; position:relative; transition:background .16s}
  .vst:active{background:#eef2f6}
  .vst .vm{flex:none; display:block}
  .vst .vt{flex:1; min-width:0}
  .vst .vt b{display:block; font-size:13.6px; line-height:1.45}
  .vst .vt i{display:block; font-style:normal; font-size:11.8px; line-height:1.5;
    color:var(--ink2); margin-top:1px}
  .vst .vgo{flex:none; color:#b6bfc9}
  .vst.dim{opacity:.34}
  @media (max-width:680px){
    .mapwrap{overflow:visible; padding:12px 12px 14px}
    svg.map{display:none}
    .vmap{display:block}
  }
  .stop{cursor:pointer}
  .stop .hit{fill:transparent}
  .stop .dot{transition:transform .16s ease; transform-origin:center; transform-box:fill-box}
  .stop:hover .dot{transform:scale(1.22)}
  .stop .lbl{font-family:var(--sans); font-size:12.5px; font-weight:700; fill:var(--ink);
    transition:transform .16s ease, fill .16s ease; transform-origin:center; transform-box:fill-box}
  .stop .sub{font-family:var(--sans); font-size:10px; fill:var(--ink2);
    transition:transform .16s ease; transform-origin:center; transform-box:fill-box}
  .stop:hover .lbl{fill:#000; transform:scale(1.22)}
  .stop:hover .sub{transform:scale(1.22)}
  .linelabel{font-family:var(--sans); font-size:13px; font-weight:800; letter-spacing:.03em}
  .linecount{font-family:var(--sans); font-size:10.5px; fill:var(--ink2)}
  .dim{opacity:.14; transition:opacity .22s}
  .mkey{display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin:14px 2px 0;
    font-size:12.4px; color:var(--ink2)}
  .mkey span{display:inline-flex; align-items:center; gap:7px}
  .mkey svg{flex:none}

  footer{max-width:1320px; margin:0 auto; padding:24px 22px 96px; color:var(--ink2); font-size:12.4px; line-height:1.85}

  .ov{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(21,24,29,.44); backdrop-filter:blur(5px);
    padding:max(44px, env(safe-area-inset-top)) 40px max(44px, env(safe-area-inset-bottom))}
  .ov.open{display:flex}
  .card{width:min(840px,100%); max-height:min(82vh, 880px); overflow:auto; background:#fff; border-radius:12px;
    box-shadow:0 30px 72px rgba(21,24,29,.3); position:relative; animation:up .3s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{opacity:0; transform:translateY(16px)}to{opacity:1;transform:none}}
  .card.swap{animation:fd .26s ease} @keyframes fd{from{opacity:.4}to{opacity:1}}
  .c-bar{height:7px; border-radius:12px 12px 0 0}
  .c-head{padding:26px 32px 22px; border-bottom:1px solid var(--line)}
  .c-line{display:flex; align-items:center; gap:9px; font-size:12px; font-weight:700; letter-spacing:.06em}
  .c-line i{width:16px; height:5px; border-radius:3px}
  .c-head h2{margin:11px 0 3px; font-size:25px; font-weight:700; letter-spacing:-.01em}
  .c-alt{font-size:12.5px; color:var(--ink2); letter-spacing:.03em}
  .c-tags{display:flex; gap:8px; margin:13px 0 11px; flex-wrap:wrap; align-items:center}
  .pill{font-size:10.5px; font-weight:800; letter-spacing:.1em; padding:4px 10px; border-radius:4px}
  .pill.ga{background:#e3f2e9; color:var(--ga)} .pill.preview{background:#fbf0d8; color:var(--pv)}
  .kind{font-size:12px; color:var(--ink2); border:1px solid var(--line); padding:3px 9px; border-radius:4px}
  .c-tag{margin:0; font-size:14.4px; color:#333a44; line-height:1.7}
  .c-act{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer; text-decoration:none;
    padding:10px 20px; border-radius:7px; font-size:13.6px; font-weight:700; transition:filter .15s, transform .15s}
  .btn:hover{filter:brightness(1.07); transform:translateY(-1px)}
  .btn.solid{background:var(--ink); color:#fff}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
  .c-body.one{display:block; padding:22px 32px 26px}
  .c-body{display:grid; grid-template-columns:1fr 1fr}
  .c-col{padding:24px 32px 30px} .c-col + .c-col{border-left:1px solid var(--line)}
  h4{margin:0 0 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); font-weight:800}
  h4.mt{margin-top:22px}
  .c-col ul{margin:0;padding-left:18px} .c-col li{margin:6px 0; font-size:14px; line-height:1.7}
  .c-col p{margin:0; font-size:14px; line-height:1.75; color:#333a44}
  .quote{margin-top:15px; padding:12px 15px; background:#f4f6f9; border-left:3px solid var(--ink);
    border-radius:0 6px 6px 0; font-size:13.6px; line-height:1.75}
  .pr{display:flex; gap:10px; justify-content:space-between; align-items:flex-start; border:1px solid var(--line);
    border-radius:7px; padding:10px 12px; margin-bottom:7px}
  .pr span{font-size:13.3px; line-height:1.65}
  .cp{border:1px solid var(--line); background:#fff; border-radius:5px; padding:4px 10px; font-size:11.5px;
    cursor:pointer; white-space:nowrap; font-weight:700}
  .cp:hover{background:#eef1f5}
  .c-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 32px 22px;
    border-top:1px solid var(--line); font-size:12.6px; color:var(--ink2)}
  .c-foot button{border:1px solid var(--line); background:#fff; border-radius:6px; padding:7px 14px;
    cursor:pointer; font-size:13px; font-weight:600}
  .c-foot button:disabled{opacity:.34; cursor:default}
  .x{position:absolute; top:16px; right:18px; border:0; background:#eef1f5; width:31px; height:31px;
    border-radius:6px; cursor:pointer; font-size:15px; line-height:1; z-index:3}
  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,16px); opacity:0; pointer-events:none;
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:7px; font-size:13px; z-index:80;
    transition:opacity .2s, transform .2s}
  .toast.show{opacity:1; transform:translate(-50%,0)}
  /* short windows (laptops at 100% scale, split screens): tighten everything
     vertically so the card still fits without scrolling */
  @media (max-height:720px){
    .ov{padding:20px 30px}
    .card{max-height:calc(100vh - 40px)}
    .c-head{padding:18px 30px 15px}
    .c-head h2{font-size:22px; margin-bottom:2px}
    .c-head .c-tag{margin-top:8px}
    .c-act{margin-top:11px}
    .c-body.one{padding:16px 30px 20px}
    .c-foot{padding:12px 30px 15px}
    h4.mt{margin-top:16px}
  }
  @media (max-width:800px){
    .c-body{grid-template-columns:1fr}
    .c-col+.c-col{border-left:0;border-top:1px solid var(--line)}
  }
  /* ---------- phones ---------- */
  @media (max-width:680px){
    .ov{padding:14px 12px}
    .card{max-height:calc(100vh - 28px); border-radius:14px}
    .c-head{padding:20px 18px 16px} .c-col{padding:18px 18px 22px}
    .c-body.one{padding:18px 16px 22px}
    .c-foot{padding:13px 18px 18px; font-size:11.6px}
    .c-foot button{padding:9px 12px}
    .c-head h2{font-size:21px}
    .c-act{gap:7px} .btn{padding:10px 13px; font-size:12.6px}
    .pr{flex-direction:column; align-items:stretch; gap:8px}
    .pr .cp{align-self:flex-start}
    .x{top:11px; right:12px}
    .hin{padding:11px 14px; gap:9px}
    .brand span{display:none}
    header .seg button{padding:6px 10px}
    main{padding:16px 14px 50px}
    .key{gap:8px}
    .cvtext{position:static; width:auto; padding:20px 18px 0; transform:none}
    .train{width:100%}
    .rails{display:none}
    .bf-go{width:100%; text-align:center}
    .pa-act{flex-wrap:wrap-reverse; gap:12px}
  }
  @media (max-width:680px) and (orientation:portrait){
    .stage{max-width:100%}
  }
  @media print{#cover,header,.key,.ov{display:none!important} #app{opacity:1!important} .mapwrap{overflow:visible}}
  button.btn.cpy{font-family:inherit; cursor:pointer}

  button.btn.cpy.done{background:#e6e8eb; border-color:#d0d4d9; color:#5b636c}


  /* ---------- a mock Copilot conversation ---------- */
  .chat{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff}
  .ch-top{display:flex; align-items:center; gap:9px; padding:11px 15px;
    border-bottom:1px solid var(--line); background:#f7f9fb}
  .ch-dot{width:9px; height:9px; border-radius:50%; flex:none}
  .ch-name{font-size:13px; font-weight:800}
  .ch-hint{margin-left:auto; font-size:11.5px; color:var(--ink2)}
  .ch-body{padding:15px}
  .ch-ask{font-size:13px; color:var(--ink2); margin-bottom:11px}
  .ch-opts{display:grid; gap:8px}
  .ch-opt{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:11px 13px; cursor:pointer; font-family:inherit;
    transition:border-color .16s, box-shadow .16s, transform .16s}
  .ch-opt:hover{border-color:#c3cdd8; box-shadow:0 6px 16px rgba(20,30,45,.08);
    transform:translateY(-1px)}
  .ch-q{flex:1; font-size:13.2px; line-height:1.65}
  .ch-go{flex:none; font-size:11.5px; font-weight:800; white-space:nowrap}
  .ch-you{margin-left:auto; max-width:82%; width:fit-content; background:#eef4fa;
    border-radius:12px 12px 4px 12px; padding:10px 13px; font-size:13.2px;
    line-height:1.7; margin-bottom:12px}
  .ch-typing{display:flex; gap:5px; padding:4px 2px}
  .ch-typing i{width:7px; height:7px; border-radius:50%; background:#c3cdd8;
    animation:blip 1.1s ease-in-out infinite}
  .ch-typing i:nth-child(2){animation-delay:.15s}
  .ch-typing i:nth-child(3){animation-delay:.3s}
  @keyframes blip{0%,100%{opacity:.3; transform:translateY(0)}50%{opacity:1; transform:translateY(-3px)}}
  .ch-reply{display:flex; gap:10px; align-items:flex-start;
    animation:say .3s ease both}
  .ch-av{flex:none; width:26px; height:26px; border-radius:8px; display:flex;
    align-items:center; justify-content:center; margin-top:2px}
  .ch-msg{flex:1; min-width:0}
  .ch-lead{margin:0 0 9px; font-size:13.4px; line-height:1.7; font-weight:700}
  .ch-msg ul{margin:0 0 9px; padding-left:18px}
  .ch-msg li{font-size:13px; line-height:1.75; margin:3px 0; color:#333a44}
  /* the reply takes the shape of whatever the agent produces */
  .ch-ul{margin:0 0 9px; padding-left:18px}
  .ch-ul li{font-size:13px; line-height:1.75; margin:3px 0; color:#333a44}
  .ch-tw{margin:2px 0 10px; overflow-x:auto; border:1px solid var(--line); border-radius:9px}
  .ch-tbl{border-collapse:collapse; width:100%; min-width:300px; font-size:12.6px}
  .ch-tbl th{text-align:left; font-weight:800; color:#4a5462; background:#f4f7fa;
    padding:8px 11px; border-bottom:1px solid var(--line); white-space:nowrap}
  .ch-tbl td{padding:8px 11px; border-bottom:1px solid #eef2f6; color:#333a44;
    line-height:1.6; vertical-align:top}
  .ch-tbl td.k{font-weight:700; color:var(--ink)}
  .ch-tbl tr:last-child td{border-bottom:0}
  .ch-steps{list-style:none; margin:2px 0 10px; padding:0; display:grid; gap:7px}
  .ch-steps li{display:flex; gap:10px; align-items:flex-start; font-size:13px;
    line-height:1.7; color:#333a44}
  .ch-sn{flex:none; min-width:24px; height:20px; padding:0 6px; border-radius:6px;
    background:#eef2f7; color:#48525f; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-top:1px}
  .ch-doc{margin:2px 0 10px; border-left:3px solid #e6ecf2; padding-left:13px;
    display:grid; gap:9px}
  .ch-doc h6{margin:0 0 2px; font-size:12.2px; font-weight:800; color:#48525f;
    letter-spacing:.02em}
  .ch-doc p{margin:0; font-size:13px; line-height:1.75; color:#333a44}
  .ch-ppl{list-style:none; margin:2px 0 10px; padding:0; display:grid; gap:8px}
  .ch-ppl li{display:flex; gap:10px; align-items:flex-start}
  .ch-pa{flex:none; width:26px; height:26px; border-radius:50%;
    background:linear-gradient(150deg,#dbe6f2,#c9d8e8); margin-top:1px}
  .ch-ppl b{display:block; font-size:13px; line-height:1.55}
  .ch-ppl i{display:block; font-style:normal; font-size:12.4px; line-height:1.6;
    color:var(--ink2)}
  .ch-fc{display:flex; gap:12px; align-items:center; border:1px solid var(--line);
    border-radius:10px; padding:11px 13px; background:#fbfcfe; margin:2px 0 10px}
  .ch-fic{flex:none; line-height:0}
  .ch-fn{min-width:0}
  .ch-fn b{display:block; font-size:13.2px; line-height:1.5; word-break:break-all}
  .ch-fn span{display:block; font-size:11.8px; color:var(--ink2); margin-top:2px}
  .ch-fl{margin:0 0 9px; padding-left:18px}
  .ch-fl li{font-size:12.9px; line-height:1.75; margin:3px 0; color:#333a44}
  @media (max-width:680px){
    .ch-tbl{font-size:12px}
    .ch-tbl th,.ch-tbl td{padding:7px 9px}
  }

   bend zone, then owns a DIFFERENT lane on the right ??so lines cross but
   never sit on top of one another. Stop positions were solved so that no
   two labels touch in Chinese or English, even at hover size.          */

  free:   { path:[[PAD,LANE.free],[B1,LANE.free],[B2,LANE.insight],[XEND,LANE.insight]],
            stops:[[246,LANE.free,'up'],[458,LANE.free,'up'],[789,LANE.insight,'up'],[1033,LANE.insight,'down']] },
  grow:   { path:[[PAD,LANE.grow],[B1,LANE.grow],[B2,LANE.free],[XEND,LANE.free]],
            stops:[[260,LANE.grow,'down'],[370,LANE.grow,'down'],[485,LANE.grow,'down'],[797,LANE.free,'up'],[952,LANE.free,'up'],[1119,LANE.free,'up']] },
  insight:{ path:[[PAD,LANE.insight],[B1,LANE.insight],[B2,LANE.work],[XEND,LANE.work]],
            stops:[[273,LANE.insight,'down'],[532,LANE.insight,'down'],[819,LANE.work,'down'],[1100,LANE.work,'down']] },
  work:   { path:[[PAD,LANE.work],[B1,LANE.work],[B2,LANE.grow],[XEND,LANE.grow]],
            stops:[[307,LANE.work,'down'],[403,LANE.work,'down'],[553,LANE.work,'down'],[789,LANE.grow,'up'],[973,LANE.grow,'up'],[1122,LANE.grow,'down']] }
};

/* rough text metrics: full-width CJK ~1.0em, latin ~0.56em at bold weight */
function txtw(t,fs){var w=0;for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);
  w += (c>0x2e80 && c<0xffe0) ? fs*1.0 : fs*0.56;} return w}
function wrapLabel(t,max,fs){
  if(txtw(t,fs)<=max) return [t];
  var words=t.split(' ');
  if(words.length<2){                     /* CJK: break by character */
    var out=[],cur='';
    for(var i=0;i<t.length;i++){
      if(txtw(cur+t[i],fs)>max && cur){out.push(cur);cur=t[i];} else cur+=t[i];
    }
    if(cur)out.push(cur); return out;
  }
  var lines=[],line='';
  for(var k=0;k<words.length;k++){
    var trial = line ? line+' '+words[k] : words[k];
    if(txtw(trial,fs)>max && line){lines.push(line);line=words[k];} else line=trial;
  }
  if(line)lines.push(line);
  return lines;
}

function renderMap(){
  var T2=t(), V=visible(), map=document.getElementById('map');

  var halo='', track='', legend='', dots='';
  /* reserved column: each row sits on that line's own lane, so it lines up
     horizontally with the line's first stop */
  LANE_ORDER.forEach(function(key){
    if(st.line!=='all' && st.line!==key) return;
    var col=LC[key], y=LANE[key];
    /* the label column is only LBLW wide, so a long line name (e.g. the
       English "Knowledge & research") is wrapped onto a second row instead
       of running over the divider. */
    var lines=wrapLabel(DOMAIN[st.lang][key], LBLW, 13);

  rows.forEach(function(l){
    var key=l[0], col=l[1], g=GEO[key];

    track+= '<path d="'+pathD(g.path)+'" fill="none" stroke="'+col+'" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>';

    var stops=AGENTS.filter(function(a){return a.domain===key});

      var pos=g.stops[si]; if(!pos) return;
      var x=pos[0], y=pos[1], side=pos[2], on=!!ids[a.id];
      var lx=x, ly, sy, anchor='middle';
      /* GAP is measured from the dot centre to the nearest edge of the
         nearest text line, so a name sits exactly as far from its dot

      if(side==='up')        { sy=y-22; ly=sy-15; }
      else if(side==='down') { ly=y+30; sy=ly+14; }
      else if(side==='right'){ anchor='start'; lx=x+22; ly=y-2; sy=y+12; }
      else                   { anchor='end';   lx=x-22; ly=y-2; sy=y+12; }
      dots+='<g class="stop'+(on?'':' dim')+'" data-id="'+a.id+'">'+
        marker(a,x,y,col)+
        '<text class="lbl" x="'+lx+'" y="'+ly+'" text-anchor="'+anchor+'">'+esc(pri(a))+'</text>'+
        '<text class="sub" x="'+lx+'" y="'+sy+'" text-anchor="'+anchor+'">'+esc(alt(a))+'</text>'+
        '<rect class="hit" x="'+(x-58)+'" y="'+(y-38)+'" width="116" height="84"/>'+
        '</g>';
    });
  });
  map.innerHTML=legend+halo+track+dots;
  Array.prototype.forEach.call(map.querySelectorAll('.stop'),function(g){
    g.onclick=function(){ open(g.getAttribute('data-id')) }});

}

/* one note at a time. The dot fills up as the wait runs down, so it is
   obvious the next step is coming rather than the change being a surprise. */
var NOTE_MS=2600;
var obT=null;
function playNotes(){
  stopNotes();
  var wrap=document.getElementById('obSay');
  var rows=wrap.querySelectorAll('.obrow'), dots=wrap.querySelectorAll('.obdot');
  if(!rows.length) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ wrap.className='pa-say all'; return }
  var i=0, held=false;
  function go(n){
    i=(n+rows.length)%rows.length;
    for(var k=0;k<rows.length;k++){
      rows[k].className='obrow'+(k===i?' on':(k===(i-1+rows.length)%rows.length?' out':''));
      dots[k].className='obdot'+(k===i?' on':'');
    }
  }
  Array.prototype.forEach.call(dots,function(b){
    b.onclick=function(){ go(+b.getAttribute('data-i')); held=true;
      clearInterval(obT); obT=setInterval(tick,NOTE_MS) } });
  wrap.onmouseenter=function(){ held=true };
  wrap.onmouseleave=function(){ held=false };
  function tick(){ if(!held && !document.hidden) go(i+1) }
  go(0);
  obT=setInterval(tick, NOTE_MS);
}
function stopNotes(){ if(obT){ clearInterval(obT); obT=null } }

        '<span><b>'+esc(x[0])+'</b><i>'+esc(x[1])+'</i></span></li>'}).join('')+'</ul>';
  if(k==='file') return '<div class="ch-fc">'+
      '<div class="ch-fic">'+fileIcon(b.icon)+'</div>'+
      '<div class="ch-fn"><b>'+esc(b.name)+'</b><span>'+esc(b.meta)+'</span></div></div>'+
      (b.items?'<ul class="ch-fl">'+b.items.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+
      (b.cols?tblHTML(b):'');
  return '<ul class="ch-ul">'+b.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
}
function tblHTML(b){
  return '<div class="ch-tw"><table class="ch-tbl"><thead><tr>'+
    b.cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+
    b.rows.map(function(row){return '<tr>'+row.map(function(c,ci){
      return '<t'+'d'+(ci===0?' class="k"':'')+'>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+
    '</tbody></table></div>';
}

function comic(a,col){
  var d=D(a), ps=d.prompts||[];
  return '<div class="chat" id="chat" data-id="'+esc(a.id)+'">'+
    '<div class="ch-top">'+
      '<span class="ch-dot" style="background:'+col+'"></span>'+
      '<span class="ch-name">'+esc(pri(a))+'</span>'+
      '<span class="ch-hint">'+esc(t().chatHint)+'</span>'+
    '</div>'+
    '<div class="ch-body" id="chBody">'+
      '<div class="ch-ask">'+esc(t().chatAsk)+'</div>'+
      '<div class="ch-opts">'+ps.map(function(p,i){
        return '<button class="ch-opt" data-i="'+i+'"><span class="ch-q">'+esc(p)+'</span>'+
               '<span class="ch-go" style="color:'+col+'">'+esc(t().chatPick)+'</span></button>'
      }).join('')+'</div>'+
    '</div>'+
  '</div>';
}
/* Runs the mock conversation: pick a prompt, watch it "send", then a
   simulated answer appears. Everything here is an illustration of the SHAPE
   of a reply ??no real data is involved.                                 */
var chatT=[];
function playComic(){
  stopComic();
  var wrap=document.getElementById('chat'); if(!wrap) return;
  var body=document.getElementById('chBody');
  var id=wrap.getAttribute('data-id'), a=null;
  for(var k=0;k<AGENTS.length;k++) if(AGENTS[k].id===id) a=AGENTS[k];
  if(!a) return;
  var col=LC[a.domain], d=D(a), T2=t();
  Array.prototype.forEach.call(wrap.querySelectorAll('.ch-opt'),function(b){
    b.onclick=function(){ run(+b.getAttribute('data-i')) };
  });
  function run(i){
    var rep=(REPLY[a.id]||[])[i]; if(!rep) return;
    var r=rep[st.lang]||rep.zh;
    body.innerHTML='<div class="ch-you">'+esc(d.prompts[i])+'</div>'+
      '<div class="ch-typing"><i></i><i></i><i></i></div>';
    chatT.push(setTimeout(function(){
      body.innerHTML='<div class="ch-you">'+esc(d.prompts[i])+'</div>'+
        '<div class="ch-reply">'+
          '<div class="ch-av" style="background:'+col+'">'+svg(a.icon,13,'#fff')+'</div>'+
          '<div class="ch-msg">'+
            '<p class="ch-lead">'+esc(r.lead)+'</p>'+
            replyBody({k:rep.k, b:r.b})+
            '<p class="ch-note">'+esc(r.note)+'</p>'+
            '<div class="ch-foot">'+
              '<span class="ch-sim">'+esc(T2.chatSim)+'</span>'+
              '<button class="cp" data-c="'+esc(d.prompts[i])+'">'+esc(T2.copyPrompt)+'</button>'+
              '<button class="ch-again">'+esc(T2.chatAgain)+'</button>'+
            '</div>'+
          '</div>'+
        '</div>';
      var again=body.querySelector('.ch-again');
      if(again) again.onclick=function(){ reset() };
      bindCopy(body);
    }, 900));
  }
  function reset(){
    body.innerHTML='<div class="ch-ask">'+esc(T2.chatAsk)+'</div>'+
      '<div class="ch-opts">'+d.prompts.map(function(p,i){
        return '<button class="ch-opt" data-i="'+i+'"><span class="ch-q">'+esc(p)+'</span>'+
               '<span class="ch-go" style="color:'+col+'">'+esc(T2.chatPick)+'</span></button>'
      }).join('')+'</div>';
    Array.prototype.forEach.call(body.querySelectorAll('.ch-opt'),function(b){
      b.onclick=function(){ run(+b.getAttribute('data-i')) };
    });
  }
}
function stopComic(){ chatT.forEach(clearTimeout); chatT=[] }

function close(){ov.classList.remove('open');document.body.classList.remove('locked');cur=null;stopComic()}
function draw(L,i){var T2=t(),a=L[i],d=D(a),col=LC[a.domain];cur={L:L,i:i};
  card.innerHTML='<div class="c-bar" style="background:'+col+'"></div><button class="x" id="x">??/button>'+
   '<div class="c-head"><div class="c-line" style="color:'+col+'"><i style="background:'+col+'"></i>'+
     esc(fmt(T2.stationOf,{d:DOMAIN[st.lang][a.domain]}))+'</div>'+
     '<h2>'+esc(pri(a))+'</h2><div class="c-alt">'+esc(alt(a))+'</div>'+
     '<div class="c-tags"><span class="pill '+a.status+'">'+esc(T2[a.status])+'</span>'+
       '</div>'+
     '<p class="c-tag">'+esc(d.tagline)+'</p>'+
     '<div class="c-act">'+(a.url?'<a class="btn solid" href="'+esc(a.url)+'">'+esc(T2.open)+'</a>':'')+
       (a.docs?'<a class="btn ghost" href="'+esc(a.docs)+'" target="_blank" rel="noopener noreferrer">'+esc(T2.docs)+'</a>':'')+
       (a.url?'<button type="button" class="btn ghost cpy" data-u="'+esc(a.url)+'" onclick="return cpLink(this)">'+esc(T2.cpLinkLbl)+'</button>':'')+'</div></div>'+
   '<div class="c-body one">'+
     '<h4>'+esc(T2.comicH)+'</h4>'+comic(a,col)+
   '</div>'+
   '<div class="c-foot"><button id="pv" '+(i===0?'disabled':'')+'>'+esc(T2.prev)+'</button>'+
     '<span>'+esc(fmt(T2.pos,{i:i+1,n:L.length}))+'</span>'+
     '<button id="nx" '+(i===L.length-1?'disabled':'')+'>'+esc(T2.next)+'</button></div>';
  card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap'); card.scrollTop=0;
  playComic();
  document.getElementById('x').onclick=close;
  document.getElementById('pv').onclick=function(){if(i>0)draw(L,i-1)};
  document.getElementById('nx').onclick=function(){if(i<L.length-1)draw(L,i+1)};
  bindCopy(card)}
function bindCopy(root){
  Array.prototype.forEach.call(root.querySelectorAll('.cp'),function(b){b.onclick=function(){var x=b.getAttribute('data-c');
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x).then(function(){toast(t().copied)},function(){fb(x)})}else fb(x)}})}
function fb(x){var ta=document.createElement('textarea');ta.value=x;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(t().copied)}catch(e){toast(t().copyManual)}document.body.removeChild(ta)}
function apply(){var T2=t();
  document.documentElement.lang=st.lang==='zh'?'zh-Hant':'en';
  ['cvt','cvs','cta','h1','lede'].forEach(function(k){document.getElementById(k).textContent=T2[k]});
  document.getElementById('destTxt').textContent=T2.dest;
  document.getElementById('bName').textContent=T2.brand;
  document.getElementById('back').textContent=T2.back;
  document.getElementById('obOpen').setAttribute('aria-label',T2.obOpen);
  document.getElementById('obOpen').title=T2.obOpen;
  document.getElementById('q').placeholder=T2.qph;
  document.getElementById('foot').textContent=T2.foot;
  document.getElementById('mkey').innerHTML=
    '<span><svg width="22" height="22"><circle cx="11" cy="11" r="8" style="fill:#616b78;stroke:#616b78;stroke-width:3"/></svg>'+esc(T2.mk[0])+'</span>'+
    '<span><svg width="22" height="22"><circle cx="11" cy="11" r="8" style="fill:#fff;stroke:#616b78;stroke-width:3.4"/></svg>'+esc(T2.mk[1])+'</span>'+
    '<span><svg width="26" height="26"><circle cx="13" cy="13" r="11.5" style="fill:#fff;stroke:#616b78;stroke-width:1.8"/><circle cx="13" cy="13" r="7" style="fill:#fff;stroke:#616b78;stroke-width:3.4"/></svg>'+esc(T2.mk[2])+'</span>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.classList.toggle('on',b.dataset.lang===st.lang)});
  try{localStorage.setItem('agentTransitLang',st.lang)}catch(e){}
  renderKey(); renderMap();
  if(ov.classList.contains('open')&&cur)draw(cur.L,cur.i);
  if(onboard.classList.contains('on'))renderOnboard()}
var cover=document.getElementById('cover'),app=document.getElementById('app'),inside=false;
var departing=false;
function enter(){
  if(inside||departing) return;
  showBrief();                 /* the announcement plays; the train waits */
}
/* only once the passenger chooses to go does the train pull away */
function depart(){
  if(departing||inside) return;
  hideBrief();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ toMap(); return }
  departing=true;
  cover.classList.add('leaving');
  setTimeout(toMap, 900);
}
function leave(){if(!inside)return;hideOnboard();if(ov.classList.contains('open'))close();inside=false;hideBrief();departing=false;
  cover.classList.remove('gone');app.classList.remove('in');document.body.classList.add('locked');
  setTimeout(function(){ cover.classList.remove('leaving') }, 30);
  window.scrollTo(0,0)}
document.getElementById('enter').onclick=enter;
document.getElementById('back').onclick=leave;
document.getElementById('obOpen').onclick=function(){ showOnboard() };
document.getElementById('q').addEventListener('input',function(e){st.q=e.target.value;renderMap()});
Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){
  b.addEventListener('click',function(e){e.stopPropagation();st.lang=b.dataset.lang;apply()})});
ov.addEventListener('click',function(e){if(e.target===ov)close()});
document.addEventListener('keydown',function(e){
  if(!ov.classList.contains('open')){
    if(e.key==='Escape'&&onboard.classList.contains('on')){hideOnboard();return}
    if(e.key==='Escape'&&inside)leave();return}
  if(e.key==='Escape')close();
  if(e.key==='ArrowLeft'){var p=document.getElementById('pv');if(p&&!p.disabled)p.click()}
  if(e.key==='ArrowRight'){var n=document.getElementById('nx');if(n&&!n.disabled)n.click()}});
apply();
</script>
</body>
</html>
