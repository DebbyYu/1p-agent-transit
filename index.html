<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1P Agent 路網圖 · Microsoft 365 Copilot</title>
<style>
  :root{
    --bg:#f2f4f7; --panel:#fff; --ink:#15181d; --ink2:#616b78; --line:#dfe3e9;
    --ga:#137a45; --pv:#a06a00; --fr:#5a4fbf;
    --spk:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9.5a4 4 0 0 1 0 5"/><path d="M18.5 7a7.5 7.5 0 0 1 0 10"/></svg>');
    --sans:"Microsoft JhengHei UI","Microsoft JhengHei","Segoe UI","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased}
  body.locked{overflow:hidden}
  button{font-family:inherit}

  #cover{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    flex-direction:column; padding:24px; background:var(--bg); overflow:hidden;
    transition:opacity .35s ease}
  #cover.gone{opacity:0; pointer-events:none; visibility:hidden}
  #cover.leaving{pointer-events:none}
  .stage{position:relative; width:min(940px,100%)}
  .rails{position:absolute; left:-70vw; right:-70vw; top:91.4%; pointer-events:none}
  .rails i{display:block; height:7px; border-radius:4px; background:#c3cad3}
  .rails i+i{margin-top:9px; background:#d8dee5}
  .train{width:100%; cursor:pointer; position:relative;
    transition:transform .3s cubic-bezier(.2,.8,.3,1)}
  .train:hover{transform:translateX(8px)}
  .train svg{display:block; width:100%; height:auto; overflow:visible}

  .train .hs-body{fill:#fff}
  .train .hs-shade{fill:#e8edf3}
  .train .hs-win{fill:#dfe6ee}
  .train .hs-glass{fill:#39424f}
  .train .hs-skirt{fill:#cfd7e0}
  .cvtext{position:absolute; left:5.5%; top:43.2%; transform:translateY(-50%);
    width:50%; color:var(--ink)}
  .dest{display:inline-flex; align-items:center; gap:8px; background:#1b1f26; color:#eef3f8;
    font-size:11px; letter-spacing:.18em; padding:5px 11px; border-radius:4px; font-weight:700}
  .dest i{width:6px;height:6px;border-radius:50%;background:#ffd77a; box-shadow:0 0 7px #ffd77a}
  .cvt{font-size:clamp(21px,2.5vw,30px); font-weight:700; margin:12px 0 8px; letter-spacing:-.015em}
  .cvs{font-size:14px; color:#2f3742; line-height:1.8; margin:0}
  .cvcta{margin-top:26px; font-size:13px; color:var(--ink2); letter-spacing:.06em; text-align:center}
  /* departure */
  #cover.leaving .train{transition:transform 1.05s cubic-bezier(.5,.02,.62,.4); transform:translateX(155vw)}
  #cover.leaving .cvcta{opacity:0; transition:opacity .3s}
  #cover.leaving .speed{opacity:1}
  .speed{position:absolute; left:0; right:0; top:34%; height:32%; opacity:0; pointer-events:none;
    transition:opacity .2s .15s}
  .speed i{position:absolute; height:3px; border-radius:2px; background:linear-gradient(90deg,transparent,#aab6c4);
    animation:whoosh .5s linear infinite}
  .speed i:nth-child(1){top:12%; left:-30%; width:38%; animation-delay:.02s}
  .speed i:nth-child(2){top:42%; left:-46%; width:52%; animation-delay:.12s}
  .speed i:nth-child(3){top:72%; left:-24%; width:30%; animation-delay:.2s}
  @keyframes whoosh{from{transform:translateX(0)}to{transform:translateX(180%)}}
  .lang-float{position:fixed; top:18px; right:20px; z-index:70}
  #cover.gone .lang-float{display:none}
  .seg{display:flex; gap:2px; background:#e6eaef; border-radius:7px; padding:3px}
  .seg button{border:0;background:transparent;color:var(--ink2);padding:6px 13px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:600}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(21,24,29,.14)}

  #app{opacity:0; transition:opacity .5s ease .25s} #app.in{opacity:1}
  header{position:sticky; top:0; z-index:30; background:rgba(242,244,247,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:13px 22px}
  .hin{max-width:1320px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700}
  .brand img{height:21px}
  .sep{width:1px; height:18px; background:var(--line)}
  .sw{flex:1; min-width:190px; position:relative}
  #q{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:7px; background:#fff;
    font-size:13.5px; outline:none; color:var(--ink)}
  #q:focus{border-color:var(--ink); box-shadow:0 0 0 3px rgba(21,24,29,.07)}
  .sw svg{position:absolute; left:11px; top:50%; transform:translateY(-50%)}
  .back{border:1px solid var(--line); background:#fff; color:var(--ink2); padding:8px 14px; border-radius:7px;
    cursor:pointer; font-size:13px; font-weight:600}
  .back:hover{background:#eef1f5}
  .intro{display:flex; align-items:flex-start; gap:14px; margin-bottom:22px}
  .intro-copy{min-width:0; padding-top:2px}
  .intro .lede{margin-bottom:0}
  .announcement-fab{position:relative; flex:none; width:56px; height:56px;
    border:1px solid #c3ddd9; border-radius:50%; background:#fff; cursor:pointer; padding:7px;
    box-shadow:0 8px 24px rgba(20,40,60,.18); transition:transform .16s, box-shadow .16s}
  .announcement-fab:hover{transform:translateY(-2px); box-shadow:0 11px 28px rgba(20,40,60,.22)}
  .announcement-fab:focus-visible{outline:3px solid rgba(15,118,110,.3); outline-offset:3px}
  .announcement-fab svg{display:block; width:100%; height:100%}

  main{max-width:1320px; margin:0 auto; padding:28px 22px 70px}
  h1{font-size:clamp(21px,2.8vw,29px); margin:0 0 9px; font-weight:700; letter-spacing:-.015em}
  .lede{margin:0 0 22px; color:var(--ink2); font-size:14.4px; line-height:1.85; max-width:82ch}
  .key{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
  .kb{border:1px solid var(--line); background:#fff; border-radius:20px; padding:7px 15px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink2); display:inline-flex; gap:8px; align-items:center}
  .kb i{width:14px; height:5px; border-radius:3px; background:var(--ink2)}
  .kb.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .kb.on i{background:#fff !important}
  .cnt{margin-left:auto; font-size:12.5px; color:var(--ink2)}

  .mapwrap{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px;
    box-shadow:0 4px 16px rgba(21,24,29,.05); overflow:hidden}
  svg.map{display:block; width:100%; height:auto}
  /* the phone version of the network: rails run downwards */
  .vmap{display:none}
  .vl{--c:#616b78; margin-top:18px}
  .vl:first-child{margin-top:2px}
  .vl h3{display:flex; align-items:center; gap:9px; margin:0 0 6px; font-size:14px}
  .vl h3 .vk{width:22px; height:7px; border-radius:4px; background:var(--c); flex:none}
  .vl h3 b{color:var(--c)}
  .vl h3 .vc{margin-left:auto; font-size:11.5px; color:var(--ink2);
    font-variant-numeric:tabular-nums}
  .vl ul{list-style:none; margin:0; padding:0; position:relative}
  .vl ul::before{content:''; position:absolute; left:13.5px; top:20px; bottom:20px;
    width:5px; border-radius:3px; background:var(--c); opacity:.92}
  .vst{display:flex; align-items:center; gap:11px; padding:5px 4px; cursor:pointer;
    border-radius:10px; position:relative; transition:background .16s}
  .vst:active{background:#eef2f6}
  .vst .vm{flex:none; display:block}
  .vst .vt{flex:1; min-width:0}
  .vst .vt b{display:block; font-size:13.6px; line-height:1.45}
  .vst .vt i{display:block; font-style:normal; font-size:11.8px; line-height:1.5;
    color:var(--ink2); margin-top:1px}
  .vst .vgo{flex:none; color:#b6bfc9}
  .vst.dim{opacity:.34}
  @media (max-width:680px){
    .mapwrap{overflow:visible; padding:12px 12px 14px}
    svg.map{display:none}
    .vmap{display:block}
  }
  .stop{cursor:pointer}
  .stop .hit{fill:transparent}
  .stop .dot{transition:transform .16s ease; transform-origin:center; transform-box:fill-box}
  .stop:hover .dot{transform:scale(1.22)}
  .stop .lbl{font-family:var(--sans); font-size:12.5px; font-weight:700; fill:var(--ink);
    transition:transform .16s ease, fill .16s ease; transform-origin:center; transform-box:fill-box}
  .stop .sub{font-family:var(--sans); font-size:10px; fill:var(--ink2);
    transition:transform .16s ease; transform-origin:center; transform-box:fill-box}
  .stop:hover .lbl{fill:#000; transform:scale(1.22)}
  .stop:hover .sub{transform:scale(1.22)}
  .linelabel{font-family:var(--sans); font-size:13px; font-weight:800; letter-spacing:.03em}
  .linecount{font-family:var(--sans); font-size:10.5px; fill:var(--ink2)}
  .dim{opacity:.14; transition:opacity .22s}
  .mkey{display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin:14px 2px 0;
    font-size:12.4px; color:var(--ink2)}
  .mkey span{display:inline-flex; align-items:center; gap:7px}
  .mkey svg{flex:none}

  footer{max-width:1320px; margin:0 auto; padding:24px 22px 96px; color:var(--ink2); font-size:12.4px; line-height:1.85}

  .ov{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(21,24,29,.44); backdrop-filter:blur(5px);
    padding:max(44px, env(safe-area-inset-top)) 40px max(44px, env(safe-area-inset-bottom))}
  .ov.open{display:flex}
  .card{width:min(840px,100%); max-height:min(82vh, 880px); overflow:auto; background:#fff; border-radius:12px;
    box-shadow:0 30px 72px rgba(21,24,29,.3); position:relative; animation:up .3s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{opacity:0; transform:translateY(16px)}to{opacity:1;transform:none}}
  .card.swap{animation:fd .26s ease} @keyframes fd{from{opacity:.4}to{opacity:1}}
  .c-bar{height:7px; border-radius:12px 12px 0 0}
  .c-head{padding:26px 32px 22px; border-bottom:1px solid var(--line)}
  .c-line{display:flex; align-items:center; gap:9px; font-size:12px; font-weight:700; letter-spacing:.06em}
  .c-line i{width:16px; height:5px; border-radius:3px}
  .c-head h2{margin:11px 0 3px; font-size:25px; font-weight:700; letter-spacing:-.01em}
  .c-alt{font-size:12.5px; color:var(--ink2); letter-spacing:.03em}
  .c-tags{display:flex; gap:8px; margin:13px 0 11px; flex-wrap:wrap; align-items:center}
  .pill{font-size:10.5px; font-weight:800; letter-spacing:.1em; padding:4px 10px; border-radius:4px}
  .pill.ga{background:#e3f2e9; color:var(--ga)} .pill.preview{background:#fbf0d8; color:var(--pv)}
  .kind{font-size:12px; color:var(--ink2); border:1px solid var(--line); padding:3px 9px; border-radius:4px}
  .c-tag{margin:0; font-size:14.4px; color:#333a44; line-height:1.7}
  .c-act{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer; text-decoration:none;
    padding:10px 20px; border-radius:7px; font-size:13.6px; font-weight:700; transition:filter .15s, transform .15s}
  .btn:hover{filter:brightness(1.07); transform:translateY(-1px)}
  .btn.solid{background:var(--ink); color:#fff}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
  .c-body.one{display:block; padding:22px 32px 26px}
  .c-body{display:grid; grid-template-columns:1fr 1fr}
  .c-col{padding:24px 32px 30px} .c-col + .c-col{border-left:1px solid var(--line)}
  h4{margin:0 0 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); font-weight:800}
  h4.mt{margin-top:22px}
  .c-col ul{margin:0;padding-left:18px} .c-col li{margin:6px 0; font-size:14px; line-height:1.7}
  .c-col p{margin:0; font-size:14px; line-height:1.75; color:#333a44}
  .quote{margin-top:15px; padding:12px 15px; background:#f4f6f9; border-left:3px solid var(--ink);
    border-radius:0 6px 6px 0; font-size:13.6px; line-height:1.75}
  .pr{display:flex; gap:10px; justify-content:space-between; align-items:flex-start; border:1px solid var(--line);
    border-radius:7px; padding:10px 12px; margin-bottom:7px}
  .pr span{font-size:13.3px; line-height:1.65}
  .cp{border:1px solid var(--line); background:#fff; border-radius:5px; padding:4px 10px; font-size:11.5px;
    cursor:pointer; white-space:nowrap; font-weight:700}
  .cp:hover{background:#eef1f5}
  .c-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 32px 22px;
    border-top:1px solid var(--line); font-size:12.6px; color:var(--ink2)}
  .c-foot button{border:1px solid var(--line); background:#fff; border-radius:6px; padding:7px 14px;
    cursor:pointer; font-size:13px; font-weight:600}
  .c-foot button:disabled{opacity:.34; cursor:default}
  .x{position:absolute; top:16px; right:18px; border:0; background:#eef1f5; width:31px; height:31px;
    border-radius:6px; cursor:pointer; font-size:15px; line-height:1; z-index:3}
  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,16px); opacity:0; pointer-events:none;
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:7px; font-size:13px; z-index:80;
    transition:opacity .2s, transform .2s}
  .toast.show{opacity:1; transform:translate(-50%,0)}
  /* short windows (laptops at 100% scale, split screens): tighten everything
     vertically so the card still fits without scrolling */
  @media (max-height:720px){
    .ov{padding:20px 30px}
    .card{max-height:calc(100vh - 40px)}
    .c-head{padding:18px 30px 15px}
    .c-head h2{font-size:22px; margin-bottom:2px}
    .c-head .c-tag{margin-top:8px}
    .c-act{margin-top:11px}
    .c-body.one{padding:16px 30px 20px}
    .c-foot{padding:12px 30px 15px}
    h4.mt{margin-top:16px}
  }
  @media (max-width:800px){
    .c-body{grid-template-columns:1fr}
    .c-col+.c-col{border-left:0;border-top:1px solid var(--line)}
  }
  /* ---------- phones ---------- */
  @media (max-width:680px){
    .ov{padding:14px 12px}
    .card{max-height:calc(100vh - 28px); border-radius:14px}
    .c-head{padding:20px 18px 16px} .c-col{padding:18px 18px 22px}
    .c-body.one{padding:18px 16px 22px}
    .c-foot{padding:13px 18px 18px; font-size:11.6px}
    .c-foot button{padding:9px 12px}
    .c-head h2{font-size:21px}
    .c-act{gap:7px} .btn{padding:10px 13px; font-size:12.6px}
    .pr{flex-direction:column; align-items:stretch; gap:8px}
    .pr .cp{align-self:flex-start}
    .x{top:11px; right:12px}
    .hin{padding:11px 14px; gap:9px}
    .brand span{display:none}
    header .seg button{padding:6px 10px}
    main{padding:16px 14px 50px}
    .key{gap:8px}
    .cvtext{position:static; width:auto; padding:20px 18px 0; transform:none}
    .train{width:100%}
    .rails{display:none}
    .intro{gap:10px; margin-bottom:18px}
    .announcement-fab{width:50px; height:50px; padding:6px}
    .bf-go{width:100%; text-align:center}
    .pa-act{flex-wrap:wrap-reverse; gap:12px}
  }
  @media (max-width:680px) and (orientation:portrait){
    .stage{max-width:100%}
  }
  @media print{#cover,header,.key,.ov{display:none!important} #app{opacity:1!important} .mapwrap{overflow:visible}}
  button.btn.cpy{font-family:inherit; cursor:pointer}

  button.btn.cpy.done{background:#e6e8eb; border-color:#d0d4d9; color:#5b636c}


  /* ---------- a mock Copilot conversation ---------- */
  .chat{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff}
  .ch-top{display:flex; align-items:center; gap:9px; padding:11px 15px;
    border-bottom:1px solid var(--line); background:#f7f9fb}
  .ch-dot{width:9px; height:9px; border-radius:50%; flex:none}
  .ch-name{font-size:13px; font-weight:800}
  .ch-hint{margin-left:auto; font-size:11.5px; color:var(--ink2)}
  .ch-body{padding:15px}
  .ch-ask{font-size:13px; color:var(--ink2); margin-bottom:11px}
  .ch-opts{display:grid; gap:8px}
  .ch-opt{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:11px 13px; cursor:pointer; font-family:inherit;
    transition:border-color .16s, box-shadow .16s, transform .16s}
  .ch-opt:hover{border-color:#c3cdd8; box-shadow:0 6px 16px rgba(20,30,45,.08);
    transform:translateY(-1px)}
  .ch-q{flex:1; font-size:13.2px; line-height:1.65}
  .ch-go{flex:none; font-size:11.5px; font-weight:800; white-space:nowrap}
  .ch-you{margin-left:auto; max-width:82%; width:fit-content; background:#eef4fa;
    border-radius:12px 12px 4px 12px; padding:10px 13px; font-size:13.2px;
    line-height:1.7; margin-bottom:12px}
  .ch-typing{display:flex; gap:5px; padding:4px 2px}
  .ch-typing i{width:7px; height:7px; border-radius:50%; background:#c3cdd8;
    animation:blip 1.1s ease-in-out infinite}
  .ch-typing i:nth-child(2){animation-delay:.15s}
  .ch-typing i:nth-child(3){animation-delay:.3s}
  @keyframes blip{0%,100%{opacity:.3; transform:translateY(0)}50%{opacity:1; transform:translateY(-3px)}}
  .ch-reply{display:flex; gap:10px; align-items:flex-start;
    animation:say .3s ease both}
  .ch-av{flex:none; width:26px; height:26px; border-radius:8px; display:flex;
    align-items:center; justify-content:center; margin-top:2px}
  .ch-msg{flex:1; min-width:0}
  .ch-lead{margin:0 0 9px; font-size:13.4px; line-height:1.7; font-weight:700}
  .ch-msg ul{margin:0 0 9px; padding-left:18px}
  .ch-msg li{font-size:13px; line-height:1.75; margin:3px 0; color:#333a44}
  /* the reply takes the shape of whatever the agent produces */
  .ch-ul{margin:0 0 9px; padding-left:18px}
  .ch-ul li{font-size:13px; line-height:1.75; margin:3px 0; color:#333a44}
  .ch-tw{margin:2px 0 10px; overflow-x:auto; border:1px solid var(--line); border-radius:9px}
  .ch-tbl{border-collapse:collapse; width:100%; min-width:300px; font-size:12.6px}
  .ch-tbl th{text-align:left; font-weight:800; color:#4a5462; background:#f4f7fa;
    padding:8px 11px; border-bottom:1px solid var(--line); white-space:nowrap}
  .ch-tbl td{padding:8px 11px; border-bottom:1px solid #eef2f6; color:#333a44;
    line-height:1.6; vertical-align:top}
  .ch-tbl td.k{font-weight:700; color:var(--ink)}
  .ch-tbl tr:last-child td{border-bottom:0}
  .ch-steps{list-style:none; margin:2px 0 10px; padding:0; display:grid; gap:7px}
  .ch-steps li{display:flex; gap:10px; align-items:flex-start; font-size:13px;
    line-height:1.7; color:#333a44}
  .ch-sn{flex:none; min-width:24px; height:20px; padding:0 6px; border-radius:6px;
    background:#eef2f7; color:#48525f; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-top:1px}
  .ch-doc{margin:2px 0 10px; border-left:3px solid #e6ecf2; padding-left:13px;
    display:grid; gap:9px}
  .ch-doc h6{margin:0 0 2px; font-size:12.2px; font-weight:800; color:#48525f;
    letter-spacing:.02em}
  .ch-doc p{margin:0; font-size:13px; line-height:1.75; color:#333a44}
  .ch-ppl{list-style:none; margin:2px 0 10px; padding:0; display:grid; gap:8px}
  .ch-ppl li{display:flex; gap:10px; align-items:flex-start}
  .ch-pa{flex:none; width:26px; height:26px; border-radius:50%;
    background:linear-gradient(150deg,#dbe6f2,#c9d8e8); margin-top:1px}
  .ch-ppl b{display:block; font-size:13px; line-height:1.55}
  .ch-ppl i{display:block; font-style:normal; font-size:12.4px; line-height:1.6;
    color:var(--ink2)}
  .ch-fc{display:flex; gap:12px; align-items:center; border:1px solid var(--line);
    border-radius:10px; padding:11px 13px; background:#fbfcfe; margin:2px 0 10px}
  .ch-fic{flex:none; line-height:0}
  .ch-fn{min-width:0}
  .ch-fn b{display:block; font-size:13.2px; line-height:1.5; word-break:break-all}
  .ch-fn span{display:block; font-size:11.8px; color:var(--ink2); margin-top:2px}
  .ch-fl{margin:0 0 9px; padding-left:18px}

var AGENTS = [{"id": "idea-coach", "name": "Idea Coach", "color": "#8a4992", "icon": "bulb", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_be483bea-dc19-b6ae-1d69-fde1f2c7b661&source=agentCenterDialog", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/agents-built-by-microsoft", "zh": {"sub": "點子教練", "tagline": "腦力激盪、創意發想與問題拆解。", "lead": "協助你發想並打磨點子，讓腦力激盪更有產出。它用輕鬆、協作的語氣激發創意，也能把模糊的問題拆解成可以著手的部分。", "can": ["針對主題快速產出多方向的點子", "協助收斂與排序", "把問題拆解成可處理的部分", "在卡關時提供不同角度"], "who": "要辦活動、想企劃、做創新提案、帶工作坊的人。", "prompts": ["我要在部門推廣 Copilot，給我 10 個低成本的點子，依可行性排序。", "把第 3 個點子展開成計畫：目標、對象、步驟、時程、成功指標。", "這個問題有點大，幫我拆成幾個可以分開處理的部分。"], "pitch": "開會前先聊五分鐘，你會帶著十個點子進會議室。", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["會議卡住了，白板還是一片空白", "「給我十個方向，依可行性排序」", "它一題一題問，把想法慢慢挖出來", "十個點子上牆，會議繼續往下走"]}, "en": {"tagline": "Brainstorming, ideation and breaking problems down.", "lead": "Helps you generate and refine ideas so a brainstorm actually produces something. It uses a light, collaborative tone to spark creativity, and can break a vague problem into parts you can act on.", "can": ["Generate ideas across several directions", "Help narrow and rank them", "Break a problem into workable parts", "Offer a fresh angle when stuck"], "who": "Anyone planning an event, campaign, innovation pitch or workshop.", "prompts": ["Ten low-cost ideas to promote Copilot in my department, ranked.", "Build out idea #3: goal, audience, steps, timeline, measures.", "This problem is too big — break it into separate pieces."], "pitch": "Five minutes here and you walk in with ten options.", "sub": "Idea Coach", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["The meeting stalls. The whiteboard is still blank.", "“Give me ten directions, ranked by how doable they are.”", "It asks one question at a time, drawing the ideas out.", "Ten ideas on the board — the meeting moves again."]}, "n": 1, "file": "MS-01", "domain": "free", "stop": 0, "prop": "bulb"}, {"id": "word-agent", "name": "Word Agent", "color": "#2b579a", "icon": "doc", "status": "ga", "domain": "free", "url": "https://m365.cloud.microsoft/chat/?titleId=P_15f67c5b-bfb1-fbd9-043a-cbb047bb7bd0", "docs": "https://support.microsoft.com/en-us/office/365-copilot-app/get-started-with-word-excel-and-powerpoint-agents-in-microsoft-365-copilot", "zh": {"sub": "Word 文件生成", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "描述你要的文件，直接產出一份 Word 檔。", "lead": "Word Agent 讓你用一句話描述需求，就生成完整的 Word 文件草稿 —— 不需要排版或設計技巧。你可以用「再短一點」「多加一段」這類高層次回饋直接修改，也能在 Word 中繼續編修。有 Copilot 授權時，它會依你原本的權限自動引用檔案、郵件、聊天與會議內容；沒有授權時可用網路資料與指定檔案。由 Microsoft 直接安裝，會出現在 Copilot 的「工具」與左側 Agent 清單，有無 Copilot 授權都能使用；產出的檔案會存到你的 OneDrive。", "can": ["從一段描述生成完整的 Word 文件草稿", "用「再短一點」「加一節」等回饋直接改稿", "引用你有權限的檔案、郵件、會議內容充實內容", "完成的檔案自動存到 OneDrive，可直接用 Word 開啟續編"], "who": "要寫提案、報告、指南、公告等長文件，又不想從空白頁開始的人。", "prompts": ["幫我做一份 2 頁的專案提案，包含前言、問題描述、解決方案與時程。", "撰寫一份 5 頁的新人上手指南，涵蓋公司簡介、規章、職務訓練與常見問題，語氣親切好讀。", "用 Q3_sales.xlsx 的資料，整理成一份含圖表的摘要報告。"], "pitch": "最有感的入門 Demo —— 一句話換一份成形的文件。", "comic": ["空白文件盯了半小時，第一句還沒生出來", "「做一份 2 頁提案，含問題、方案與時程」", "它寫出整份草稿，還能說「再短一點」", "Word 檔存進 OneDrive，你只要改"]}, "en": {"sub": "Word Agent", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "Describe the document you need — get a Word file back.", "lead": "Word Agent creates a full Word document from a plain description, with no formatting or design skills needed. Refine the draft with high-level feedback like “make it shorter” or “add a section”, or keep editing in Word. With a Copilot licence it pulls in your files, emails, chats and meetings under your existing permissions; without one it works from the web and files you point at. Installed by Microsoft and shown in the Tools menu and agent list; available with or without a Copilot licence. Generated files are saved to your OneDrive.", "can": ["Generate a complete Word draft from one prompt", "Refine with high-level feedback such as “make it shorter”", "Ground the draft in files, emails and meetings you can already access", "Save the finished file to OneDrive and keep editing in Word"], "who": "Anyone writing proposals, reports, guides or announcements who would rather not start from a blank page.", "prompts": ["Create a 2-page project proposal with an introduction, problem statement, solution overview, and timeline.", "Draft a 5-page employee onboarding guide with company overview, policies, role-specific training and FAQs. Use a friendly, informative tone.", "Use data from Q3_sales.xlsx to create a summary report with charts."], "pitch": "The most tangible demo there is — one sentence in, a finished document out.", "comic": ["Half an hour on a blank page. Still no first line.", "“A 2-page proposal: problem, solution, timeline.”", "It drafts the whole thing — then “make it shorter”.", "A Word file in your OneDrive. You just edit."]}, "n": 2, "file": "MS-02", "prop": "doc"}, {"id": "excel-agent", "name": "Excel Agent", "color": "#1c7a4a", "icon": "grid", "status": "ga", "domain": "free", "url": "https://m365.cloud.microsoft/chat/?titleId=P_8d830dc1-9a14-1528-1182-c8e3be94cf5a", "docs": "https://support.microsoft.com/en-us/office/365-copilot-app/get-started-with-word-excel-and-powerpoint-agents-in-microsoft-365-copilot", "zh": {"sub": "試算表生成", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "描述你要追蹤什麼，生成含公式與圖表的活頁簿。", "lead": "Excel Agent 依你的描述建立試算表，含分頁、公式與圖表，不必自己從空白活頁簿開始。可以用高層次回饋調整結構，完成後在 Excel 中繼續分析。有 Copilot 授權時，能引用你有權限的檔案資料。由 Microsoft 直接安裝，會出現在 Copilot 的「工具」與左側 Agent 清單，有無 Copilot 授權都能使用；產出的檔案會存到你的 OneDrive。", "can": ["從描述建立含分頁、公式與圖表的活頁簿", "建立預算、追蹤表等常見範本結構", "引用你有權限的既有檔案資料", "完成的活頁簿存到 OneDrive，可用 Excel 續編"], "who": "常要做預算表、追蹤表、報表，但不想手刻公式與版面的人。", "prompts": ["建立一份預算追蹤表，每月一個分頁並附總結圖表。", "做一個追蹤每月營收與支出的 Excel 活頁簿，包含圖表與年初至今分析。", "把這份清單整理成可篩選的追蹤表，並加上狀態與負責人欄位。"], "pitch": "從空白活頁簿到可用的追蹤表，中間那段最花時間的工作交給它。", "comic": ["要做預算表，光是拉公式就一個下午", "「建一份預算追蹤表，每月一頁附圖表」", "它建好分頁、公式與圖表", "活頁簿直接能用，之後自己會算"]}, "en": {"sub": "Excel Agent", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "Say what you want to track — get a workbook with formulas and charts.", "lead": "Excel Agent builds a spreadsheet from your description, with sheets, formulas and charts, so you never start from a blank workbook. Adjust the structure with high-level feedback, then carry on analysing in Excel. With a Copilot licence it can use data from files you already have access to. Installed by Microsoft and shown in the Tools menu and agent list; available with or without a Copilot licence. Generated files are saved to your OneDrive.", "can": ["Build a workbook with sheets, formulas and charts from a prompt", "Set up common structures such as budgets and trackers", "Use data from files you can already access", "Save to OneDrive and continue in Excel"], "who": "Anyone who regularly builds budgets, trackers or reports and would rather skip the formula plumbing.", "prompts": ["Set up a budget tracker with monthly sheets and summary charts.", "Create an Excel workbook for tracking my monthly revenue and expenses, with charts and year-to-date analysis.", "Turn this list into a filterable tracker with status and owner columns."], "pitch": "The slow part is going from a blank workbook to a usable tracker — this removes it.", "comic": ["A budget sheet — and a whole afternoon of formulas.", "“A budget tracker, monthly sheets, summary charts.”", "It builds the sheets, the formulas and the charts.", "A working workbook that recalculates itself."]}, "n": 3, "file": "MS-03", "prop": "grid"}, {"id": "powerpoint-agent", "name": "PowerPoint Agent", "color": "#c43e1c", "icon": "slides", "status": "ga", "domain": "free", "url": "https://m365.cloud.microsoft/chat/?titleId=P_54c3f25e-3850-e1e6-231a-aa85fbe9447b", "docs": "https://support.microsoft.com/en-us/office/365-copilot-app/get-started-with-word-excel-and-powerpoint-agents-in-microsoft-365-copilot", "zh": {"sub": "簡報生成", "status": "Agent", "product": "Microsoft 365 Copilot" and design included.", "“Add a slide” — and it keeps adjusting."]}, "n": 4, "file": "MS-04", "prop": "slides"}, {"id": "ai-learning-advisor", "name": "AI Learning Advisor", "color": "#9a423c", "icon": "compass", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_8c75de5c-bfa0-68eb-5528-89a1c35a90b7&source=agentCenterDialog", "docs": "https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-template-ai-learning-advisor", "zh": {"sub": "AI 學習顧問", "tagline": "學 Agent Builder、Copilot Studio 與 AI 技能，卡住也能問。", "lead": "協助你學習並上手 Microsoft 的 AI 與低程式碼技術，涵蓋 Agent Builder、Copilot Studio 與 Power Platform。它用白話解釋概念、規劃個人化學習路徑、依情境推薦該用哪個工具，並在你卡住時協助排錯。", "can": ["用白話解釋 AI 與低程式碼概念", "依你的程度規劃學習路徑", "依情境推薦該用哪個工具", "遇到問題時協助排錯"], "who": "想導入 Copilot／Power Platform 但不知從何開始的人，以及要帶團隊上手的推廣者。", "prompts": ["我沒接觸過 Copilot Studio，幫我規劃四週的入門學習計畫。", "我想自動彙整週報，該用 Agent Builder、Copilot Studio 還是 Power Automate？", "我建的 Agent 一直抓不到知識來源，幫我找出可能的原因。"], "pitch": "推廣 AI 工具的第一站——先讓大家知道自己該學什麼。", "status": "Agent", "product": "Copilot Studio / Microsoft Learn", "comic": ["想自己做 agent，文件看到第三頁就卡住", "「幫我規劃四週的 Copilot Studio 入門」", "它排出學習路徑，卡住還能隨時追問", "照著走，四週後你真的做得出來"]}, "en": {"tagline": "Learn Agent Builder, Copilot Studio and AI skills — and debug them.", "lead": "Teaches and guides you across Microsoft’s AI and low-code stack, including Agent Builder, Copilot Studio and Power Platform. It explains concepts in plain language, builds a personalised learning path, recommends the right tool for a scenario and helps troubleshoot when you get stuck.", "can": ["Explain AI and low-code concepts plainly", "Build a learning path for your level", "Recommend the right tool for the job", "Help troubleshoot when things break"], "who": "Anyone starting with Copilot or Power Platform, and those enabling a team.", "prompts": ["I’ve never used Copilot Studio — plan me a four-week path.", "To automate a weekly report, should I use Agent Builder, Copilot Studio or Power Automate?", "My agent isn’t picking up its knowledge source — help me debug it."], "pitch": "The first stop when rolling out AI tools.", "sub": "AI Learning Advisor", "status": "Agent", "product": "Copilot Studio / Microsoft Learn", "comic": ["You want to build an agent. Page three loses you.", "“Plan me four weeks of Copilot Studio basics.”", "It lays out a path — and answers when you get stuck.", "Four weeks later, you have actually built one."]}, "n": 5, "file": "MS-05", "domain": "grow", "stop": 0, "prop": "compass"}, {"id": "learning", "name": "Learning", "color": "#4c7637", "icon": "cap", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_ad3f22f7-c966-2226-0625-5498e4ef2f73&source=agentCenterDialog", "docs": "", "zh": {"sub": "學習", "tagline": "個人化的學習推薦與技能發展。", "lead": "提供個人化的學習推薦與技能發展建議，協助你依照自己的角色與目標持續累積能力。", "can": ["依你的角色推薦合適的學習內容", "協助規劃技能發展方向", "把學習與工作目標連結起來", "追蹤學習進度"], "who": "想持續進修的員工，以及負責規劃學習發展的人資與主管。", "prompts": ["依我的角色，推薦接下來三個月值得投入的學習主題。", "我想強化資料分析能力，有哪些課程或資源適合我？", "幫我把學習目標拆成每月可以完成的進度。"], "pitch": "學習不再是「有空再說」，而是排進行程裡的事。", "status": "Agent", "product": "Microsoft Viva Learning", "comic": ["想進修，但不知道該從哪個主題開始", "「依我的角色，推薦三個月的學習主題」", "它對照你的角色與現有技能給建議", "拿到一份排好順序的學習清單"]}, "en": {"tagline": "Personalised learning recommendations and skill growth.", "lead": "Offers personalised learning recommendations and skill development guidance, so you can keep building capability around your role and goals.", "can": ["Recommend learning suited to your role", "Help shape a skill development direction", "Connect learning to your work goals", "Track how you are progressing"], "who": "Employees investing in their own growth, plus HR and managers planning development.", "prompts": ["Given my role, what should I learn over the next three months?", "I want to strengthen data analysis — which resources suit me?", "Break my learning goal into monthly milestones."], "pitch": "Learning stops being “when I have time” and gets a slot.", "sub": "Learning", "status": "Agent", "product": "Microsoft Viva Learning", "comic": ["You want to learn — but which topic even matters?", "“Given my role, what should I learn this quarter?”", "It weighs your role and your current skills.", "A learning list, already in priority order."]}, "n": 6, "file": "MS-06", "domain": "grow", "stop": 2, "prop": "book"}, {"id": "prompt-coach", "name": "Prompt Coach", "color": "#5a6fa8", "icon": "chat", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_f0ff38f1-4d81-a9b7-dbf1-b161328daa1f", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/agents-built-by-microsoft", "zh": {"sub": "提示教練", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "問得更好，才拿得到更好的答案。", "lead": "Prompt Coach 教你如何有效地組織提問，讓 Copilot 與其他 AI Agent 給出更精準、更有用的回應，把 AI 工具的價值真正發揮出來。它像一位有耐心的老師，帶你一步步把模糊的需求寫成清楚的提示，並在過程中說明為什麼這樣問更好。", "can": ["把模糊的問題改寫成清楚有效的提示", "示範好提示與不好提示的差別", "針對你的實際工作情境調整提問結構", "協助建立可重複使用的提示範本"], "who": "剛開始用 Copilot、或覺得「AI 回答得不夠好」的人 —— 這是最好的第一站。", "prompts": ["我想請 Copilot 整理會議紀錄，但結果都太籠統，幫我改寫成更好的提示。", "教我一個寫提示的通用結構，並用我的工作情境示範一次。", "幫我把這個提示做成範本，之後每週都能重複使用。"], "pitch": "推廣 Copilot 的最佳起手式 —— 先讓大家會問，其他 Agent 才發揮得出來。", "comic": ["問了 AI，回來的答案總是很空泛", "「這句我問得不好，幫我改寫」", "它示範改寫，還說明為什麼這樣問更好", "同一個問題，答案完全不一樣了"]}, "en": {"sub": "Prompt Coach", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "Ask better, get better.", "lead": "Prompt Coach teaches you how to structure queries effectively, so Copilot and other AI-powered agents come back with more precise and useful responses — which is where most of the value in these tools actually sits. It works like a patient teacher, walking you from a vague request to a clear prompt and explaining why the change works.", "can": ["Rewrite a vague question into a clear, effective prompt", "Show the difference between a weak and a strong prompt", "Tune prompt structure to your real work scenarios", "Help you build reusable prompt templates"], "who": "Anyone new to Copilot, or anyone who feels the answers are not good enough yet.", "prompts": ["My meeting-notes prompts keep giving vague results — rewrite this into a better prompt.", "Teach me a general structure for writing prompts and demo it on my job.", "Turn this prompt into a template I can reuse every week."], "pitch": "The best opening move for Copilot adoption — teach people to ask, and every other agent gets better.", "comic": ["You ask the AI. The answer is always vague.", "“This prompt fell flat — rewrite it for me.”", "It rewrites it, and explains why the new one works.", "Same question, a completely different answer."]}, "domain": "grow", "n": 7, "file": "MS-07", "prop": "star"}, {"id": "writing-coach", "name": "Writing Coach", "color": "#92497c", "icon": "pen", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_e3d64609-7a28-6de6-3093-402c20bb96ce&source=agentCenterDialog", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/agents-built-by-microsoft", "zh": {"sub": "寫作教練", "tagline": "改善文件、Email 與簡報的內容品質。", "lead": "像一位支持你的教練，針對清晰度、連貫性、文法與語氣給出具體回饋，讓文件、郵件與簡報的內容更專業、更有說服力，並在過程中說明為什麼這樣改更好。", "can": ["檢視並優化語氣、文法與行文", "針對文件、郵件、簡報給修改建議", "調整同一段內容給不同對象", "說明每項修改的理由"], "who": "每天要寫信、寫報告、做簡報的所有人。", "prompts": ["幫我看這封給客戶的信：語氣恰當嗎？哪裡可以更精簡？", "把這段內容改寫成三個版本：對主管、對同事、對客戶。", "這頁簡報的文字太多，幫我濃縮成三個重點。"], "pitch": "它不只給你改好的稿，還讓你下一次自己就寫得更好。", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["信寫好了，但不確定語氣會不會太衝", "「幫我看這封客戶信，哪裡能更精簡」", "它逐段指出語氣與冗詞", "寄出前就先修好，不用事後補救"]}, "en": {"tagline": "Better documents, email and presentation content.", "lead": "Acts as a supportive coach, giving specific feedback on clarity, coherence, grammar and tone so documents, email and decks read as professional and persuasive — and explaining why each change is an improvement.", "can": ["Review and improve tone, grammar and flow", "Give edits for docs, email and slides", "Adapt the same content for different audiences", "Explain the reasoning behind each change"], "who": "Everyone who writes email, reports or presentations.", "prompts": ["Review this customer email — right tone? Where can it be tighter?", "Rewrite this for my manager, a peer and a client.", "This slide has too much text — cut it to three points."], "pitch": "A better draft today, and a better writer next time.", "sub": "Writing Coach", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["The email is written. Is the tone too sharp?", "“Check this client email — where can it be tighter?”", "It goes paragraph by paragraph on tone and padding.", "Fixed before you send, not apologised for after."]}, "n": 8, "file": "MS-08", "domain": "grow", "stop": 1, "prop": "pen"}, {"id": "career-coach", "name": "Career Coach", "color": "#92495f", "icon": "path", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_fcaaab0f-7062-e237-7557-77b846a22444&source=agentCenterDialog", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/agents-built-by-microsoft", "zh": {"sub": "職涯教練", "tagline": "職涯發展、技能建議與成長規劃。", "lead": "依你目前的角色、經驗與可取得的學習資源，提供個人化的職涯建議與行動計畫，涵蓋技能養成、學習機會與職務轉換。", "can": ["盤點現有技能並找出缺口", "建議適合的學習機會", "規劃職務轉換的具體路徑", "把目標拆成階段性行動"], "who": "正在規劃職涯下一步、或想系統性補強技能的工作者。", "prompts": ["依我現在的角色與想去的方向，列出要補強的技能並排優先順序。", "幫我把「一年內轉往資料分析」拆成每季目標與行動。", "以我的經驗，有哪些內部機會值得優先投入？"], "pitch": "把職涯焦慮，換成一張走得動的行動路線圖。", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["想往前走一步，但不知道該補什麼", "「以我的角色與目標，該補哪些技能」", "它從現況倒推出該補強的順序", "技能清單排好，下一步很明確"]}, "en": {"tagline": "Career development, skill advice and growth planning.", "lead": "Gives personalised career advice and action plans based on your current role, experience and the learning available to you — covering skill building, learning opportunities and role transitions.", "can": ["Take stock of skills and spot the gaps", "Suggest relevant learning opportunities", "Map a route through a role transition", "Turn goals into staged actions"], "who": "Anyone planning a next move or closing skill gaps methodically.", "prompts": ["Rank the skills I need for where I want to go.", "Break “move into data analysis within a year” into quarterly goals.", "Which internal opportunities suit my background?"], "pitch": "Swaps career anxiety for a route map you can walk.", "sub": "Career Coach", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["You want to move up. You don’t know what to build.", "“For my role and my goal, which skills come first?”", "It works backwards from where you want to be.", "A ranked skill list, and an obvious next step."]}, "n": 9, "file": "MS-09", "domain": "grow", "stop": 2, "prop": "ladder"}, {"id": "sme-finder", "name": "SME Finder", "color": "#9a683c", "icon": "search", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_a8f2ed7d-faf1-5ad5-e4bc-dbd09bf80ed8&source=agentCenterDialog", "docs": "https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-template-sme-finder", "zh": {"sub": "專家搜尋", "tagline": "根據組織資料，找出公司裡最懂的那個人。", "lead": "協助員工依據組織資料，找到某個主題、產品、流程或客戶問題最合適的內部專家（Subject Matter Expert）。它會回傳排序後的專家名單並附上判斷依據，讓你知道為什麼是這個人。", "can": ["依主題找出組織內的專家並排序", "附上判斷依據與佐證來源", "涵蓋文件、訊息、會議等組織資料", "協助你準備開口請教的訊息"], "who": "新進人員、跨部門合作者，以及在大組織裡找不到人問的每一個人。", "prompts": ["公司裡誰最懂這個產品的技術架構？請附上判斷依據。", "我要找處理過類似客戶案例的人，列出三位並排序。", "幫我寫一則簡短訊息，向這位同事請教這個問題。"], "pitch": "在大組織裡，最難的不是問題，而是不知道要問誰。", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["這題公司裡誰最懂？問了一圈還是沒答案", "「誰最熟這個產品的技術架構？」", "它比對組織內部資料，附上判斷依據", "直接找到對的人，不用再一路轉問"]}, "en": {"tagline": "Find the right internal expert, from your org’s own data.", "lead": "Helps employees find the most credible subject matter expert inside the organisation for a topic, product, process or customer question. It returns ranked experts with the evidence behind each match.", "can": ["Find and rank internal experts on a topic", "Show the evidence behind each match", "Draw on documents, messages and meetings", "Help you draft the outreach"], "who": "New joiners, cross-team collaborators and anyone lost in a large org.", "prompts": ["Who knows this product’s architecture best? Show me why.", "Find three people who handled a similar customer case, ranked.", "Draft a short note asking this colleague for help."], "pitch": "The hard part in a big org isn’t the question — it’s who to ask.", "sub": "SME Finder", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["Who here knows this? You have asked five people.", "“Who knows this product’s architecture best?”", "It reads your org’s own data, and shows its reasoning.", "Straight to the right person. No more forwarding."]}, "n": 10, "file": "MS-10", "domain": "grow", "stop": 1, "prop": "people"}, {"id": "researcher", "name": "Researcher", "color": "#3e368c", "icon": "book", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_552e6eda-fc18-7fb9-0ef6-1bf2de3393e4", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/get-started-with-researcher-in-microsoft-365-copilot", "zh": {"sub": "研究員", "tagline": "整合企業與外部資料做深度研究，報告可輸出成多種格式。", "lead": "Researcher 是處理複雜、多步驟研究任務的推理型 Agent。它同時參考網路資訊與你有權限的工作內容（檔案、郵件、會議、聊天），整理出可信、精煉且切題的資料，並標註引用來源，讓結論站得住腳。完成的研究報告還能直接輸出成 Word、PowerPoint、PDF、資訊圖表或語音，拿到就能用。", "can": ["針對一個主題做多步驟、深入的資料蒐集", "同時整合企業內部與外部公開資料", "產出附引用來源的完整研究報告", "研究報告可輸出成 Word、PowerPoint、PDF、資訊圖表或語音"], "who": "需要做市場研究、競品分析、提案前置作業與產業趨勢彙整的人。", "prompts": ["根據目前所有文件與會議紀錄，建立客戶 A 的 Account Plan，並補充最新市場資訊與競爭者動態。", "把剛剛的研究結果做成一份 PowerPoint，重點放在給主管看的結論。", "比較這兩個解決方案的優缺點，做成資訊圖表並標註每項結論的來源。"], "pitch": "一個問題丟進去，回來的是一份有引用來源的研究報告。", "status": "推理型 Agent", "product": "Microsoft 365 Copilot", "comic": ["客戶下週要 Account Plan，資料散在各處", "「用所有文件與會議紀錄，建客戶 A 的計畫」", "它讀內部資料，再補上市場與競爭者動態", "報告可以是 Word、簡報、PDF 或語音"]}, "en": {"tagline": "Deep research across your data and the web — delivered in the format you need.", "lead": "Researcher is a reasoning agent built for complex, multi-step research. It draws on both the open web and the work content you have access to — files, email, meetings and chats — then returns a thorough answer with its sources cited. The finished report can be delivered as a Word document, a PowerPoint deck, a PDF, an infographic or audio, ready to use.", "can": ["Run deep, multi-step investigation on a topic", "Combine internal enterprise data with external sources", "Produce a full report with citations", "Deliver the report as Word, PowerPoint, PDF, an infographic or audio"], "who": "Anyone doing market research, competitive analysis or pre-sales preparation.", "prompts": ["Build an account plan for Customer A from all our existing documents and meeting notes, and add the latest market intelligence and competitor moves.", "Turn that research into a PowerPoint deck aimed at an executive audience.", "Compare these two solutions as an infographic, citing the source behind each point."], "pitch": "Ask once and you get back a sourced report, not a paragraph.", "sub": "Researcher", "status": "Reasoning agent", "product": "Microsoft 365 Copilot", "comic": ["An account plan due next week. Material everywhere.", "“Build the plan for Customer A from all our material.”", "It reads your files, then adds the market outside.", "Delivered as Word, a deck, a PDF or audio."]}, "n": 11, "file": "MS-11", "domain": "insight", "stop": 3, "prop": "report"}, {"id": "analyst", "name": "Analyst", "color": "#6d4992", "icon": "chart", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_8cfc4e6f-267e-db15-c6e7-3fc47a54f61e", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/get-started-with-analyst-in-microsoft-365-copilot", "zh": {"sub": "資料分析師", "tagline": "整合多種資料來源，做到根因分析與管理層洞察。", "lead": "Analyst 是專門處理資料的推理型 Agent，把原始數字轉化成可行動的洞察。它能整合 Excel、CSV、PDF、Word 與 Power BI 等多種資料來源，自動進行分析、推理與根本原因分析（Root Cause Analysis），並產出管理層等級的洞察報告。不論是追蹤營運指標、判讀趨勢或做預測，它都能簡化複雜的資料集，並以清楚易讀的方式視覺化呈現。", "can": ["整合 Excel、CSV、PDF、Word、Power BI 等多種資料來源一起分析", "執行進階資料分析與統計判讀", "做根本原因分析（Root Cause Analysis），找出趨勢與異常背後的成因", "產出管理層等級的洞察報告與圖表", "建立預測與情境比較"], "who": "需要看數字做決策的業務、營運、財務、PM 與主管。", "prompts": ["整合這份 Excel 與這份 PDF 報告，分析銷售下滑的根本原因，並做成管理層看的一頁洞察。", "分析這份銷售資料，找出成長最快與衰退最快的產品，並說明可能原因。", "依過去 6 個月的數據預估下一季，並列出你的假設條件。"], "pitch": "跨檔案一起看，直接給你根因與管理層要的結論。", "status": "推理型 Agent", "product": "Microsoft 365 Copilot", "comic": ["數字攤在眼前，但說不出為什麼會掉", "「合併這份 Excel 與 PDF，找出根本原因」", "它跨檔案推理，做根本原因分析", "一頁洞察，直接拿去給主管看"]}, "en": {"tagline": "Multi-source analysis, root cause and executive insight.", "lead": "Analyst is a reasoning agent for data work, turning raw numbers into insight you can act on. It brings together Excel, CSV, PDF, Word and Power BI sources, runs the analysis and reasoning — including root cause analysis — and produces executive-level insight reports. Whether tracking metrics, reading trends or forecasting, it simplifies complex datasets and presents them as clear visuals and findings.", "can": ["Analyse Excel, CSV, PDF, Word and Power BI sources together", "Run advanced analysis and interpret the statistics", "Perform root cause analysis on trends and outliers, not just flag them", "Produce executive-level insight reports and charts", "Build forecasts and compare scenarios"], "who": "Sales, operations, finance, PMs and managers who decide on numbers.", "prompts": ["Combine this Excel file with this PDF report, find the root cause of the sales drop, and write a one-page executive insight.", "Analyse this sales data — fastest growing and declining products, with reasons.", "Project next quarter from six months of data and list your assumptions."], "pitch": "Reads across your files and hands back the root cause, not just the chart.", "sub": "Analyst", "status": "Reasoning agent", "product": "Microsoft 365 Copilot", "comic": ["The numbers are in. Nobody can say why they fell.", "“Combine this Excel and PDF — find the root cause.”", "It reasons across files and runs a root cause analysis.", "A one-page insight you can take upstairs."]}, "n": 12, "file": "MS-12", "domain": "insight", "stop": 2, "prop": "chart"}, {"id": "surveys", "name": "Surveys", "color": "#37766f", "icon": "poll", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_a64931a6-8080-b1e7-e057-8e775a24ed66&source=agentCenterDialog", "docs": "", "zh": {"sub": "問卷調查", "tagline": "建立問卷、分析結果、產生洞察。", "lead": "協助你建立問卷、分析回收結果，並從資料中整理出可用的洞察。", "can": ["依主題快速建立問卷題目", "調整題型與問法", "分析回收結果的分布與趨勢", "把結果整理成可讀的洞察"], "who": "要做員工調查、活動回饋、客戶滿意度調查的人。", "prompts": ["幫我設計一份員工滿意度問卷，10 題以內，涵蓋工作、團隊與發展。", "這份問卷的結果有什麼值得注意的趨勢？", "把這次回饋整理成三個主要發現與建議。"], "pitch": "從出題到看懂結果，一條龍完成。", "status": "Agent", "product": "Microsoft Forms", "comic": ["問卷要出題、要催、要統計，全都自己來", "「設計一份 10 題的員工滿意度問卷」", "它出題、收集，再把結果整理成洞察", "結果自己長出來，不用再一份份數"]}, "en": {"tagline": "Build surveys, analyse results, surface insight.", "lead": "Helps you create surveys, analyse the responses that come back and pull usable insight out of the data.", "can": ["Draft survey questions on a topic", "Tune question types and wording", "Analyse response distribution and trends", "Turn results into readable insight"], "who": "Anyone running employee surveys, event feedback or satisfaction studies.", "prompts": ["Design an employee satisfaction survey, under 10 questions.", "What trends stand out in these responses?", "Summarise this feedback into three findings and recommendations."], "pitch": "From writing the questions to understanding the answers.", "sub": "Surveys", "status": "Agent", "product": "Microsoft Forms", "comic": ["Write it, chase it, count it — the survey is all yours.", "“Draft a 10-question employee satisfaction survey.”", "It drafts, collects, and turns answers into insight.", "The results assemble themselves."]}, "n": 13, "file": "MS-13", "domain": "insight", "stop": 1, "prop": "poll"}, {"id": "workforce-insights-frontier", "name": "Workforce Insights (Frontier)", "color": "#377656", "icon": "pulse", "status": "frontier", "url": "https://m365.cloud.microsoft/chat/?titleId=P_cee13b52-3ca2-f561-866d-5f91fdbf6689&source=agentCenterDialog", "docs": "", "zh": {"sub": "人力洞察", "tagline": "分析組織協作、人力與工作模式。", "lead": "協助分析組織的協作情況、人力配置與工作模式，讓管理決策有資料依據。屬於 Frontier 計畫的功能，仍在持續演進中。", "can": ["分析團隊與跨部門的協作情況", "觀察工作模式與時間運用", "提供人力與組織面的洞察", "讓管理決策有數據支撐"], "who": "人資、組織發展與需要了解團隊運作狀況的主管。", "prompts": ["我們團隊的跨部門協作情況如何？有哪些值得注意的模式？", "團隊的會議時間佔比是否偏高？", "從工作模式來看，有哪些地方可以改善運作效率？"], "pitch": "組織的運作狀況，第一次有了看得見的樣子。", "status": "Frontier 計畫 Agent", "product": "Viva Insights", "comic": ["團隊看起來很忙，卻說不出忙在哪", "「我們的跨部門協作有哪些模式？」", "它分析協作、人力與工作模式", "用資料說話，不再靠印象判斷"]}, "en": {"tagline": "Analyse collaboration, workforce and working patterns.", "lead": "Analyses how the organisation collaborates, how the workforce is deployed and how work actually happens, so management decisions rest on data. Part of the Frontier program, so it is still evolving.", "can": ["Analyse team and cross-team collaboration", "Look at working patterns and time use", "Provide workforce and organisational insight", "Ground management decisions in data"], "who": "HR, organisational development and leaders who need to see how teams run.", "prompts": ["How does my team collaborate across departments? Any patterns worth noting?", "Is the share of time spent in meetings too high?", "From these working patterns, where could we improve?"], "pitch": "For the first time, how the organisation runs is visible.", "sub": "Workforce Insights (Frontier)", "status": "Frontier program agent", "product": "Viva Insights", "comic": ["The team is clearly busy. Busy with what, exactly?", "“What patterns are there in how we work together?”", "It analyses collaboration, workforce and work patterns.", "You describe the team with data, not impressions."]}, "n": 14, "file": "MS-14", "domain": "insight", "stop": 0, "prop": "network"}, {"id": "plan-my-day", "name": "Plan My Day", "color": "#8c8031", "icon": "sunrise", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_ba30b62a-2a65-5db1-5925-b1889ad225f8&source=agentCenterDialog", "docs": "https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-template-plan-my-day", "zh": {"sub": "每日規劃", "tagline": "整理今天的會議、待辦、郵件與優先順序。", "lead": "把今天的會議、待辦事項與郵件整理成一份晨間簡報，並標出真正的優先順序，讓每天都能在資訊充分、準備妥當的狀態下開始。", "can": ["彙整今日會議、待辦與待回覆郵件", "標出今天真正的優先事項", "提醒需要提前準備的行程", "讓一天的開始有明確方向"], "who": "每天早上被行程與訊息淹沒、想先抓重點的人。", "prompts": ["幫我做今天的晨間簡報：重要會議、待回覆的事、三個優先。", "今天行程很滿，哪些會議是我可以不用參加的？", "今天有沒有需要提前準備的會議？"], "pitch": "一天的開始，從「先看看有什麼」變成「我知道今天要幹嘛」。", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["早上打開電腦，不知道該先做哪一件", "「幫我做今天的晨間簡報與三個優先」", "它掃過今天的會議、待辦與郵件", "一份排好順序的今日清單"]}, "en": {"tagline": "Today’s meetings, tasks, mail and priorities — sorted.", "lead": "Compiles today’s meetings, tasks and email into a morning briefing and surfaces what actually matters, so you start the day informed and prepared.", "can": ["Pull together meetings, tasks and replies owed", "Surface the real priorities for today", "Flag anything needing advance preparation", "Give the day a clear direction"], "who": "Anyone whose morning starts buried in invites and messages.", "prompts": ["Give me today’s brief: key meetings, replies owed, top three priorities.", "My day is packed — which meetings could I skip?", "Anything today I should prepare for in advance?"], "pitch": "The day starts with “I know what I’m doing”.", "sub": "Plan My Day", "status": "Agent", "product": "Microsoft 365 Copilot", "comic": ["You open the laptop with no idea what comes first.", "“Give me a morning brief and my top three.”", "It sweeps today’s meetings, tasks and mail.", "Today, already in order."]}, "n": 15, "file": "MS-15", "domain": "work", "stop": 0, "prop": "clock"}, {"id": "planner-agent", "name": "Planner Agent", "color": "#37763c", "icon": "board", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_b2f25cb5-1ccd-b7ed-8a74-35d2b43e0130&source=agentCenterDialog", "docs": "", "zh": {"sub": "專案規劃", "tagline": "管理專案、追蹤任務、規劃工作。", "lead": "協助管理專案、追蹤任務進度並規劃工作安排，讓專案的推進狀況一目了然。", "can": ["建立與整理專案任務", "追蹤任務進度與負責人", "協助安排工作順序與時程", "掌握專案整體狀況"], "who": "專案經理、團隊負責人與需要管理多線任務的人。", "prompts": ["幫我把這個專案拆成任務，並排出先後順序。", "目前有哪些任務逾期或沒有負責人？", "這週團隊完成了哪些任務？還有哪些卡住？"], "pitch": "專案狀況不用開會問，打開就知道。", "status": "Agent", "product": "Microsoft Planner", "comic": ["專案任務散在各處，追到後來自己也亂了", "「把這個專案拆成任務並排出先後」", "它拆解目標、排序、標出相依性", "專案有了骨架，進度追得回來"]}, "en": {"tagline": "Manage projects, track tasks, plan the work.", "lead": "Helps manage projects, track task progress and plan work, so the state of a project is visible at a glance.", "can": ["Create and organise project tasks", "Track progress and owners", "Sequence work and set timelines", "See the overall project picture"], "who": "Project managers, team leads and anyone juggling several workstreams.", "prompts": ["Break this project into tasks and put them in order.", "Which tasks are overdue or have no owner?", "What did the team finish this week, and what is stuck?"], "pitch": "You no longer need a meeting to find out where the project is.", "sub": "Planner Agent", "status": "Agent", "product": "Microsoft Planner", "comic": ["Tasks scattered everywhere. You have lost the thread.", "“Break this project into tasks and order them.”", "It breaks the goal down and orders the work.", "The project has a spine again."]}, "n": 16, "file": "MS-16", "domain": "work", "stop": 2, "prop": "board"}, {"id": "workflows-frontier", "name": "Workflows (Frontier)", "color": "#738c31", "icon": "flow", "status": "frontier", "url": "https://m365.cloud.microsoft/chat/?titleId=P_91fe45e4-9413-b0e6-dad9-c855b4952367&source=agentCenterDialog", "docs": "", "zh": {"sub": "工作流程", "tagline": "用自然語言，建立 Workflow 與自動化。", "lead": "讓你用自然語言描述需求，就能建立工作流程與自動化，不需要從頭設定每一個步驟。屬於 Frontier 計畫的功能，仍在持續演進中。", "can": ["用自然語言描述就能建立流程", "把重複性的工作自動化", "協助調整既有流程", "降低建立自動化的門檻"], "who": "想把重複作業自動化，但不想寫程式或設定複雜流程的人。", "prompts": ["每週一早上把上週的專案進度整理成郵件寄給團隊。", "有人在這個清單新增項目時，通知負責人並建立待辦。", "幫我調整這個流程，讓它只在工作日執行。"], "pitch": "自動化不再是 IT 的事，說一句話就能建立。", "status": "Frontier 計畫 Agent", "product": "Copilot Studio", "comic": ["同一件事每週手動做一次，做到麻木", "「每週一把上週進度整理成郵件寄出」", "用白話描述，它就建好自動化流程", "之後它自己跑，你不用再記得"]}, "en": {"tagline": "Build workflows and automation in natural language.", "lead": "Describe what you want in natural language and have the workflow or automation built for you, without configuring every step by hand. Part of the Frontier program, so it is still evolving.", "can": ["Build a flow from a plain-language description", "Automate repetitive work", "Adjust an existing flow", "Lower the barrier to automation"], "who": "Anyone who wants to automate repetitive work without building it by hand.", "prompts": ["Every Monday morning, email the team last week’s project progress.", "When someone adds an item to this list, notify the owner and create a task.", "Change this flow so it only runs on weekdays."], "pitch": "Automation stops being an IT project — you just describe it.", "sub": "Workflows (Frontier)", "status": "Frontier program agent", "product": "Copilot Studio", "comic": ["The same manual chore. Every single week.", "“Every Monday, email last week’s progress to the team.”", "Plain words in, a working automation out.", "It runs itself. You stop remembering."]}, "n": 17, "file": "MS-17", "domain": "work", "stop": 1, "prop": "gear"}, {"id": "sharepoint-list-agent", "name": "SharePoint List Agent", "color": "#36518c", "icon": "list", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_d57d4da7-846d-b18b-1845-90ea5921bed8&source=agentCenterDialog", "docs": "", "zh": {"sub": "SharePoint 清單", "tagline": "把 Copilot 對話直接變成清單項目。", "lead": "能把 Copilot 的對話內容轉為 SharePoint List 項目，讓討論出來的資訊直接落地成可管理的紀錄。", "can": ["把對話內容轉成清單項目", "讓討論結果直接進入既有清單", "減少手動複製貼上的步驟", "讓資訊有結構地保存下來"], "who": "用 SharePoint 清單管理需求、issue、資產或紀錄的團隊。", "prompts": ["把剛剛討論出來的三個待辦，建立成清單項目。", "幫我把這些資訊整理成清單需要的欄位格式。", "這份會議紀錄裡的待辦，請轉成清單項目。"], "pitch": "討論完不用再手動輸入一次，直接變成紀錄。", "status": "Agent", "product": "SharePoint Online", "comic": ["會議討論完，待辦還躺在筆記裡", "「把剛剛的三個待辦建成清單項目」", "它把對話內容直接寫進 SharePoint 清單", "討論完就進系統，不會再漏掉"]}, "en": {"tagline": "Turn a Copilot conversa /* Copy the agent's direct link. Same feedback as the prompt copy buttons:
   a toast at the bottom, plus a temporary label on the button itself. The
   button stays enabled so it can be pressed again. */
function cpLink(btn){
  var u=btn.getAttribute('data-u'); if(!u) return false;
  var lbl=t(), was=btn.getAttribute('data-label');
  if(was===null){ was=btn.textContent; btn.setAttribute('data-label', was); }
  function ok(){
    toast(lbl.linkCopied);
    btn.textContent=lbl.cpLinkDone; btn.classList.add('done');
    clearTimeout(btn._cpT);
    btn._cpT=setTimeout(function(){ btn.textContent=btn.getAttribute('data-label'); btn.classList.remove('done'); },1800);
  }
  function fb(){
    var ta=document.createElement('textarea');
    ta.value=u; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok() }catch(e){ toast(lbl.copyManual) }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(ok, fb);
  } else fb();
  return false;
}

/* rough text metrics: full-width CJK ~1.0em, latin ~0.56em at bold weight */
function txtw(t,fs){var w=0;for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);
  w += (c>0x2e80 && c<0xffe0) ? fs*1.0 : fs*0.56;} return w}
function wrapLabel(t,max,fs){
  if(txtw(t,fs)<=max) return [t];
  var words=t.split(' ');
  if(words.length<2){                     /* CJK: break by character */
    var out=[],cur='';
    for(var i=0;i<t.length;i++){
      if(txtw(cur+t[i],fs)>max && cur){out.push(cur);cur=t[i];} else cur+=t[i];
    }
    if(cur)out.push(cur); return out;
  }
  var lines=[],line='';
  for(var k=0;k<words.length;k++){
    var trial = line ? line+' '+words[k] : words[k];
    if(txtw(trial,fs)>max && line){lines.push(line);line=words[k];} else line=trial;
  }
  if(line)lines.push(line);
  return lines;
}

/* one note at a time. The dot fills up as the wait runs down, so it is
   obvious the next step is coming rather than the change being a surprise. */
var NOTE_MS=2600;
var obT=null;
function playNotes(){
  stopNotes();
  var wrap=document.getElementById('obSay');
  var rows=wrap.querySelectorAll('.obrow'), dots=wrap.querySelectorAll('.obdot');
  if(!rows.length) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ wrap.className='pa-say all'; return }
  var i=0, held=false;
  function go(n){
    i=(n+rows.length)%rows.length;
    for(var k=0;k<rows.length;k++){
      rows[k].className='obrow'+(k===i?' on':(k===(i-1+rows.length)%rows.length?' out':''));
      dots[k].className='obdot'+(k===i?' on':'');
    }
  }
  Array.prototype.forEach.call(dots,function(b){
    b.onclick=function(){ go(+b.getAttribute('data-i')); held=true;
      clearInterval(obT); obT=setInterval(tick,NOTE_MS) } });
  wrap.onmouseenter=function(){ held=true };
  wrap.onmouseleave=function(){ held=false };
  function tick(){ if(!held && !document.hidden) go(i+1) }
  go(0);
  obT=setInterval(tick, NOTE_MS);
}
function stopNotes(){ if(obT){ clearInterval(obT); obT=null } }

/* Renders one reply in whatever form suits it. */
function replyBody(r){
  var k=r.k||'list', b=r.b;
  if(k==='table') return tblHTML(b);
  if(k==='steps') return '<ol class="ch-steps">'+b.map(function(x){
      return '<li><span class="ch-sn">'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></li>'}).join('')+'</ol>';
  if(k==='doc') return '<div class="ch-doc">'+b.map(function(x){
      return '<section><h6>'+esc(x[0])+'</h6><p>'+esc(x[1])+'</p></section>'}).join('')+'</div>';
  if(k==='people') return '<ul class="ch-ppl">'+b.map(function(x){
      return '<li><span class="ch-pa" aria-hidden="true"></span>'+
        '<span><b>'+esc(x[0])+'</b><i>'+esc(x[1])+'</i></span></li>'}).join('')+'</ul>';
  if(k==='file') return '<div class="ch-fc">'+
      '<div class="ch-fic">'+fileIcon(b.icon)+'</div>'+
      '<div class="ch-fn"><b>'+esc(b.name)+'</b><span>'+esc(b.meta)+'</span></div></div>'+
      (b.items?'<ul class="ch-fl">'+b.items.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+
      (b.cols?tblHTML(b):'');
  return '<ul class="ch-ul">'+b.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
}
function tblHTML(b){
  return '<div class="ch-tw"><table class="ch-tbl"><thead><tr>'+
    b.cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+
    b.rows.map(function(row){return '<tr>'+row.map(function(c,ci){
      return '<t'+'d'+(ci===0?' class="k"':'')+'>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+
    '</tbody></table></div>';
}

function comic(a,col){

      '<div class="ch-ask">'+esc(t().chatAsk)+'</div>'+

               '<span class="ch-go" style="color:'+col+'">'+esc(t().chatPick)+'</span></button>'
      }).join('')+'</div>'+

}

var chatT=[];
function playComic(){
  stopComic();
  var wrap=document.getElementById('chat'); if(!wrap) return;
  var body=document.getElementById('chBody');
  var id=wrap.getAttribute('data-id'), a=null;

  var col=LC[a.domain], d=D(a), T2=t();
  Array.prototype.forEach.call(wrap.querySelectorAll('.ch-opt'),function(b){
    b.onclick=function(){ run(+b.getAttribute('data-i')) };

  function run(i){
    var rep=(REPLY[a.id]||[])[i]; if(!rep) return;
    var r=rep[st.lang]||rep.zh;
    body.innerHTML='<div class="ch-you">'+esc(d.prompts[i])+'</div>'+
      '<div class="ch-typing"><i></i><i></i><i></i></div>';
    chatT.push(setTimeout(function(){
      body.innerHTML='<div class="ch-you">'+esc(d.prompts[i])+'</div>'+
        '<div class="ch-reply">'+
          '<div class="ch-av" style="background:'+col+'">'+svg(a.icon,13,'#fff')+'</div>'+
          '<div class="ch-msg">'+
            '<p class="ch-lead">'+esc(r.lead)+'</p>'+
            replyBody({k:rep.k, b:r.b})+
            '<p class="ch-note">'+esc(r.note)+'</p>'+
            '<div class="ch-foot">'+
              '<span class="ch-sim">'+esc(T2.chatSim)+'</span>'+
              '<button class="cp" data-c="'+esc(d.prompts[i])+'">'+esc(T2.copyPrompt)+'</button>'+
              '<button class="ch-again">'+esc(T2.chatAgain)+'</button>'+
            '</div>'+
          '</div>'+
        '</div>';
      var again=body.querySelector('.ch-again');
      if(again) again.onclick=function(){ reset() };
      bindCopy(body);
    }, 900));
  }
  function reset(){
    body.innerHTML='<div class="ch-ask">'+esc(T2.chatAsk)+'</div>'+
      '<div class="ch-opts">'+d.prompts.map(function(p,i){
        return '<button class="ch-opt" data-i="'+i+'"><span class="ch-q">'+esc(p)+'</span>'+
               '<span class="ch-go" style="color:'+col+'">'+esc(T2.chatPick)+'</span></button>'
      }).join('')+'</div>';
    Array.prototype.forEach.call(body.querySelectorAll('.ch-opt'),function(b){
      b.onclick=function(){ run(+b.getAttribute('data-i')) };
    });
  }
}
function stopComic(){ chatT.forEach(clearTimeout); chatT=[] }

function close(){ov.classList.remove('open');document.body.classList.remove('locked');cur=null;stopComic()}
function draw(L,i){var T2=t(),a=L[i],d=D(a),col=LC[a.domain];cur={L:L,i:i};
  card.innerHTML='<div class="c-bar" style="background:'+col+'"></div><button class="x" id="x">✕</button>'+
   '<div class="c-head"><div class="c-line" style="color:'+col+'"><i style="background:'+col+'"></i>'+
     esc(fmt(T2.stationOf,{d:DOMAIN[st.lang][a.domain]}))+'</div>'+
     '<h2>'+esc(pri(a))+'</h2><div class="c-alt">'+esc(alt(a))+'</div>'+
     '<div class="c-tags"><span class="pill '+a.status+'">'+esc(T2[a.status])+'</span>'+
       '</div>'+
     '<p class="c-tag">'+esc(d.tagline)+'</p>'+
     '<div class="c-act">'+(a.url?'<a class="btn solid" href="'+esc(a.url)+'">'+esc(T2.open)+'</a>':'')+
       (a.docs?'<a class="btn ghost" href="'+esc(a.docs)+'" target="_blank" rel="noopener noreferrer">'+esc(T2.docs)+'</a>':'')+
       (a.url?'<button type="button" class="btn ghost cpy" data-u="'+esc(a.url)+'" onclick="return cpLink(this)">'+esc(T2.cpLinkLbl)+'</button>':'')+'</div></div>'+
   '<div class="c-body one">'+
     '<h4>'+esc(T2.comicH)+'</h4>'+comic(a,col)+
   '</div>'+
   '<div class="c-foot"><button id="pv" '+(i===0?'disabled':'')+'>'+esc(T2.prev)+'</button>'+
     '<span>'+esc(fmt(T2.pos,{i:i+1,n:L.length}))+'</span>'+
     '<button id="nx" '+(i===L.length-1?'disabled':'')+'>'+esc(T2.next)+'</button></div>';
  card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap'); card.scrollTop=0;
  playComic();
  document.getElementById('x').onclick=close;
  document.getElementById('pv').onclick=function(){if(i>0)draw(L,i-1)};
  document.getElementById('nx').onclick=function(){if(i<L.length-1)draw(L,i+1)};
  bindCopy(card)}
function bindCopy(root){
  Array.prototype.forEach.call(root.querySelectorAll('.cp'),function(b){b.onclick=function(){var x=b.getAttribute('data-c');
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x).then(function(){toast(t().copied)},function(){fb(x)})}else fb(x)}})}
function fb(x){var ta=document.createElement('textarea');ta.value=x;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(t().copied)}catch(e){toast(t().copyManual)}document.body.removeChild(ta)}
function apply(){var T2=t();
  document.documentElement.lang=st.lang==='zh'?'zh-Hant':'en';
  ['cvt','cvs','cta','h1','lede'].forEach(function(k){document.getElementById(k).textContent=T2[k]});
  document.getElementById('destTxt').textContent=T2.dest;
  document.getElementById('bName').textContent=T2.brand;
  document.getElementById('back').textContent=T2.back;
  document.getElementById('obOpen').setAttribute('aria-label',T2.obOpen);
  document.getElementById('obOpen').title=T2.obOpen;
  document.getElementById('q').placeholder=T2.qph;
  document.getElementById('foot').textContent=T2.foot;
  document.getElementById('mkey').innerHTML=
    '<span><svg width="22" height="22"><circle cx="11" cy="11" r="8" style="fill:#616b78;stroke:#616b78;stroke-width:3"/></svg>'+esc(T2.mk[0])+'</span>'+
    '<span><svg width="22" height="22"><circle cx="11" cy="11" r="8" style="fill:#fff;stroke:#616b78;stroke-width:3.4"/></svg>'+esc(T2.mk[1])+'</span>'+
    '<span><svg width="26" height="26"><circle cx="13" cy="13" r="11.5" style="fill:#fff;stroke:#616b78;stroke-width:1.8"/><circle cx="13" cy="13" r="7" style="fill:#fff;stroke:#616b78;stroke-width:3.4"/></svg>'+esc(T2.mk[2])+'</span>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.classList.toggle('on',b.dataset.lang===st.lang)});
  try{localStorage.setItem('agentTransitLang',st.lang)}catch(e){}
  renderKey(); renderMap();
  if(ov.classList.contains('open')&&cur)draw(cur.L,cur.i);
  if(onboard.classList.contains('on'))renderOnboard()}
var cover=document.getElementById('cover'),app=document.getElementById('app'),inside=false;
var departing=false;
function enter(){
  if(inside||departing) return;
  showBrief();                 /* the announcement plays; the train waits */
}
/* only once the passenger chooses to go does the train pull away */
function depart(){
  if(departing||inside) return;
  hideBrief();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ toMap(); return }
  departing=true;
  cover.classList.add('leaving');
  setTimeout(toMap, 900);
}
function leave(){if(!inside)return;hideOnboard();if(ov.classList.contains('open'))close();inside=false;hideBrief();departing=false;
  cover.classList.remove('gone');app.classList.remove('in');document.body.classList.add('locked');
  setTimeout(function(){ cover.classList.remove('leaving') }, 30);
  window.scrollTo(0,0)}
document.getElementById('enter').onclick=enter;
document.getElementById('back').onclick=leave;
document.getElementById('obOpen').onclick=function(){ showOnboard() };
document.getElementById('q').addEventListener('input',function(e){st.q=e.target.value;renderMap()});
Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){
  b.addEventListener('click',function(e){e.stopPropagation();st.lang=b.dataset.lang;apply()})});
ov.addEventListener('click',function(e){if(e.target===ov)close()});
document.addEventListener('keydown',function(e){
  if(!ov.classList.contains('open')){
    if(e.key==='Escape'&&onboard.classList.contains('on')){hideOnboard();return}
    if(e.key==='Escape'&&inside)leave();return}
  if(e.key==='Escape')close();
  if(e.key==='ArrowLeft'){var p=document.getElementById('pv');if(p&&!p.disabled)p.click()}
  if(e.key==='ArrowRight'){var n=document.getElementById('nx');if(n&&!n.disabled)n.click()}});
apply();
</script>
</body>
</html>
